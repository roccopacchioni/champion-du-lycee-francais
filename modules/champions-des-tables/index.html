<style>
:root{
  /* Layout : une colonne (560px max). Tableau d'affichage en haut, tuiles de modes vives, match = terrain + grande opération + pavé numérique. Un seul thème assumé : stade de nuit. */
  --night:#0A1633; --night-2:#12244F; --night-3:#1B336E; --night-4:#2A4690;
  --line:rgba(226,236,255,.14); --chalk:#F4F7FB; --muted:#A8B8DB; --ink:#0A1633;
  --pitch:#1E9452; --pitch-2:#198648;
  --gold:#FFC83D; --gold-d:#C9921A; --red:#EF4655; --red-d:#B92736; --sky:#4CC9F0; --sky-d:#2A93B5;
  --green:#3DDC84; --green-d:#22A35E; --orange:#FF9F1C; --orange-d:#C47406; --violet:#B388FF; --violet-d:#7F55CC; --pink:#F15BB5; --pink-d:#B83286;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-score:'Chakra Petch',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background-color:var(--night);background-image:radial-gradient(70% 45% at 0% 0%,rgba(110,160,255,.20),transparent 70%),radial-gradient(70% 45% at 100% 0%,rgba(110,160,255,.16),transparent 70%);background-attachment:fixed;color:var(--chalk);font:400 16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:16px;font-family:var(--f-display);font-size:20px;background:var(--gold);color:#2A1A00;box-shadow:0 5px 0 var(--gold-d);transition:transform .08s,box-shadow .08s;text-align:center;line-height:1.1}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.btn svg{width:24px;height:24px;flex:none}
.btn.alt{background:var(--night-3);color:var(--chalk);box-shadow:0 5px 0 #0B1838}
.btn.green{background:var(--green);color:var(--ink);box-shadow:0 5px 0 var(--green-d)}
.btn.danger{background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-d)}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:24px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:inherit;text-decoration:underline;text-underline-offset:3px;font-weight:600;padding:8px;align-self:center;font-size:15px}
.mini{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;background:var(--night-3);font-weight:600;font-size:14px;border:1px solid var(--line)}
.mini svg{width:16px;height:16px}

/* Accueil */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--night-2);border:1px solid var(--line);border-radius:22px;padding:12px}
.avatar{width:76px;height:76px;border-radius:18px;background:radial-gradient(circle at 50% 30%,var(--night-4),var(--night));display:grid;place-items:center}
.who{min-width:0}
.name{font-family:var(--f-display);font-size:28px;line-height:1}
.lvl{color:var(--gold);font-weight:600;font-size:14px;margin-top:2px}
.xpbar{height:10px;background:var(--night);border-radius:99px;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FFE08A);border-radius:inherit}
.xpnum{font:600 12px var(--f-score);color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.wallet{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--night);font:700 16px var(--f-score);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:18px;height:18px}
.pill.flame{color:var(--orange)}
.pill.flame b{color:var(--chalk)}

.mission{background-color:var(--pitch);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 30px,transparent 30px 60px),linear-gradient(170deg,rgba(255,255,255,.08),rgba(0,0,0,.18));border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.mission.wait{background-color:var(--night-2)}
.eyebrow{font:700 12px var(--f-score);letter-spacing:.12em;text-transform:uppercase;color:#D9FFE8}
.mission.wait .eyebrow{color:var(--gold)}
.mission h2{font-size:30px}
.mission p{color:#E4FFEF}
.mission.wait p{color:var(--muted)}
.dots{display:flex;gap:6px;align-items:center;font-size:13px;color:#D9FFE8;font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)}
.dot.on{background:var(--gold)}
.dots span:last-child{margin-left:6px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:20px;min-height:132px;text-align:left;color:var(--ink);background:var(--tc);box-shadow:0 6px 0 var(--td);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--td)}
.glyph{font-family:var(--f-display);font-size:40px;line-height:1;height:42px;display:flex;align-items:center;margin-bottom:auto}
.glyph svg{width:38px;height:38px}
.tn{font-family:var(--f-display);font-size:22px;line-height:1.05}
.ts{font-size:13px;font-weight:600;opacity:.78;line-height:1.25}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hold{position:relative;overflow:hidden}
.holdfill{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--gold)}
.hold.holding .holdfill{width:100%;transition:width 1.8s linear}
.foot{text-align:center;font-size:12px;color:var(--muted)}

/* Écrans */
.top{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px}
.top h1{font-size:25px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--night-2);display:grid;place-items:center;border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lbl{font:700 12px var(--f-score);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.help{font-size:14px;color:var(--muted)}
.lead{font-size:16px;color:var(--muted)}
.tchips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tchip{aspect-ratio:1;border-radius:14px;background:var(--night-3);font-family:var(--f-display);font-size:24px;display:grid;place-items:center;position:relative;color:var(--chalk)}
.tchip.on{background:var(--tc);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.tchip.locked{opacity:.45}
.tchip.locked svg{position:absolute;top:5px;right:5px;width:12px;height:12px}
.tchip[disabled]{cursor:default}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;background:var(--night);padding:5px;border-radius:14px}
.seg button{padding:11px 8px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted);line-height:1.2}
.seg button.on{background:var(--sky);color:var(--ink)}
.fmts{display:flex;flex-direction:column;gap:10px}
.fmt{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:14px;border-radius:18px;background:var(--night-2);border:2px solid var(--line)}
.fmt.on{border-color:var(--red);background:linear-gradient(135deg,rgba(239,70,85,.22),var(--night-2))}
.fmt-n{font-family:var(--f-display);font-size:22px}
.fmt-big{grid-row:span 3;align-self:center;font:700 34px/1 var(--f-score);color:var(--gold);text-align:right}
.fmt-big small{display:block;font-size:13px;color:var(--muted)}
.fmt-d{font-size:13px;color:var(--muted)}
.fmt-r{font:600 13px var(--f-score);color:var(--sky)}

/* Match */
.game{display:flex;flex-direction:column;gap:10px}
.gbar{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px}
.m-chrono .gbar{grid-template-columns:44px 1fr auto auto}
.track{height:14px;border-radius:99px;background:var(--night-3);position:relative;margin-right:13px}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--pitch),var(--green));border-radius:inherit;transition:width .3s}
.track b{position:absolute;top:50%;left:0;width:26px;height:26px;transform:translate(-50%,-50%);transition:left .3s}
.track b svg{width:100%;height:100%}
.combo{min-width:58px;display:flex;align-items:center;justify-content:flex-end;gap:2px;font:700 20px var(--f-score);color:var(--orange)}
.combo svg{width:22px;height:22px}
.combo.hot{color:var(--gold);animation:pulse .5s infinite alternate}
.clock{font:700 36px/1 var(--f-score);text-align:center;font-variant-numeric:tabular-nums}
.clock.low{color:var(--red)}
.count{font:700 26px/1 var(--f-score);font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font-size:15px;color:var(--muted)}
.pace{display:flex;flex-direction:column;gap:5px}
.pacebar{height:10px;border-radius:99px;background:var(--night-3);position:relative}
.pacebar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--sky);border-radius:inherit;transition:width .25s}
.pacebar b{position:absolute;top:-4px;width:4px;height:18px;background:var(--gold);border-radius:2px;left:0;transform:translateX(-50%)}
.pacetxt{font-size:13px;color:var(--muted);font-weight:600}
.pacetxt.ahead{color:var(--green)}
.pacetxt.behind{color:var(--orange)}
.stage{position:relative;width:min(100%,52vh);margin-inline:auto;aspect-ratio:360/190;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1),0 10px 30px -12px rgba(0,0,0,.6)}
.m-chrono .stage{width:min(100%,38vh)}
.stage>svg{width:100%;height:100%}
.ball{position:absolute;left:50%;top:72.6%;width:7%;aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.ball svg{width:100%;height:100%}
.net{transform-box:fill-box;transform-origin:50% 0}
.net.shake{animation:netshake .45s}
.keeper{transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s cubic-bezier(.25,.8,.3,1)}
.keeper.dl{transform:translate(-20px,4px) rotate(-68deg)}
.keeper.dr{transform:translate(20px,4px) rotate(68deg)}
.qzone{min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.lvltag{font:700 12px var(--f-score);letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:rgba(61,220,132,.12);padding:3px 10px;border-radius:99px}
.lvltag.up{animation:pop .4s}
.eq{font-family:var(--f-display);font-size:clamp(44px,13vw,74px);line-height:1;display:flex;align-items:center;gap:.2em;flex-wrap:wrap;justify-content:center;font-variant-numeric:tabular-nums}
.eq .op{color:var(--muted)}
.eq .word{font-family:var(--f-body);font-weight:700;font-size:.42em;color:var(--muted)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;height:1.15em;padding:0 .12em;border-radius:.18em;background:rgba(255,255,255,.08);border-bottom:.08em solid var(--gold);color:var(--gold);font-variant-numeric:tabular-nums}
.slot.empty::after{content:'';width:.06em;height:.7em;background:var(--gold);animation:blink 1s steps(1) infinite}
.slot.good{background:rgba(61,220,132,.2);border-color:var(--green);color:var(--green)}
.slot.bad{background:rgba(239,70,85,.18);border-color:var(--red);color:var(--red)}
.file{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.file span{min-width:34px;padding:4px 6px;border-radius:8px;background:var(--night-3);font:700 15px var(--f-score);text-align:center;color:var(--muted)}
.file span.on{background:var(--tc);color:var(--ink)}
.file span.cur{outline:2px solid var(--gold);color:var(--gold)}
.file.big span{background:var(--tc);color:var(--ink);font-size:17px;min-width:40px}
.fb:empty{display:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:60px;border-radius:16px;background:var(--night-3);font:700 30px var(--f-score);box-shadow:0 4px 0 #0B1838;color:var(--chalk);display:grid;place-items:center}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #0B1838}
.key.ok{background:var(--green);color:var(--ink);box-shadow:0 4px 0 var(--green-d);font-family:var(--f-display);font-size:24px;font-weight:400}
.key.del svg{width:28px;height:28px}
.corr{background:var(--night-2);border:2px solid var(--orange);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:pop .25s}
.corr-t{font-family:var(--f-display);font-size:22px;color:var(--orange)}
.corr-eq{font-family:var(--f-display);font-size:38px;line-height:1.1}
.corr-eq b{color:var(--green);font-weight:400}
.corr-eq.small{font-size:24px}
.corr-you{color:var(--muted);font-size:14px}
.corr-hint{display:flex;gap:8px;align-items:flex-start;background:var(--night);border-radius:12px;padding:10px 12px;font-size:16px}
.corr-hint svg{flex:none;width:20px;height:20px;color:var(--gold);margin-top:2px}
.corr-note{font-size:13px;color:var(--muted)}
.fixflash{font-family:var(--f-display);font-size:30px;color:var(--orange);text-align:center;animation:pop .2s}
.prob{width:100%;background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ptag{font:700 12px var(--f-score);letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.ptext{font-size:20px;line-height:1.55;font-weight:500;max-width:60ch}
.ptools{display:flex;gap:8px;flex-wrap:wrap}
.phint{background:var(--night);border-radius:12px;padding:10px 12px;font-size:15px;color:#FFE7A8}
.pans{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;flex-wrap:wrap}
.pans .slot{font-family:var(--f-display);font-size:42px;font-weight:400}
.unit{color:var(--muted)}

/* Bandeaux, fenêtres, confettis */
.banner{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:40;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:92vw}
.banner b{font-family:var(--f-display);font-weight:400;font-size:clamp(60px,19vw,104px);line-height:.9;color:var(--gold);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 rgba(0,0,0,.35)}
.banner span{font-family:var(--f-display);font-size:23px;background:var(--ink);padding:5px 16px;border-radius:99px;color:var(--chalk)}
.banner.show{animation:bannerIn var(--bd,900ms) ease-out forwards}
.banner.info b{font-size:clamp(34px,10vw,52px);color:var(--sky)}
.banner.save b{font-size:clamp(40px,12vw,64px);color:var(--orange)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,10,28,.8);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.mbox{background:var(--night-2);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .25s}
.mbox h2{font-size:28px}
.cd{font-family:var(--f-display);font-size:140px;line-height:1;color:var(--gold);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:pop .45s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}

/* Résultats */
.results{display:flex;flex-direction:column;gap:12px;text-align:center}
.results h2{font-size:32px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:8px}
.stars svg{width:64px;height:64px;color:var(--night-3)}
.stars .st1 svg{width:80px;height:80px}
.stars svg.on{color:var(--gold);animation:starIn .55s both}
.scoreline{font-size:16px;color:var(--muted)}
.scoreline b{color:var(--chalk);font:700 20px var(--f-score)}
.coach{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:14px}
.cic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sky);display:grid;place-items:center;color:var(--ink)}
.cic svg{width:24px;height:24px}
.rewards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.rw{padding:8px 14px;border-radius:99px;background:var(--night-2);font:700 18px var(--f-score);display:inline-flex;gap:6px;align-items:center}
.rw svg{width:20px;height:20px}
.newbox{background:linear-gradient(135deg,#3A2A00,#5C4300);border:2px solid var(--gold);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;animation:pop .4s}
.newbox b{font-family:var(--f-display);font-weight:400;font-size:21px;color:var(--gold)}
.newbox span{font-size:14px;color:#FFEFC2}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chiplist.left{justify-content:flex-start}
.fchip{padding:6px 10px;border-radius:10px;background:var(--night-3);font:700 16px var(--f-score)}
.fchip small{color:var(--muted);font-size:11px}

/* Programme */
.day{background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.day.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,61,.22)}
.day.locked{opacity:.55}
.day-h{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.day-n{width:48px;height:48px;border-radius:14px;background:var(--night-3);display:grid;place-items:center;font-family:var(--f-display);font-size:20px}
.day.done .day-n{background:var(--green);color:var(--ink)}
.day h3{font-size:20px}
.day p{font-size:14px;color:var(--muted)}
.day-h>svg{width:24px;height:24px;color:var(--green)}
.day.locked .day-h>svg{color:var(--muted)}
.day-steps{display:flex;flex-direction:column;gap:6px}
.stepbtn{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:12px;background:var(--night-3);font-weight:500;font-size:15px}
.sb-ic{width:34px;height:34px;border-radius:50%;background:var(--night);display:grid;place-items:center;font:700 15px var(--f-score)}
.stepbtn.ok .sb-ic{background:var(--green);color:var(--ink)}
.sb-ic svg{width:18px;height:18px}
.finale{text-align:center;align-items:center}
.finale svg{width:56px;height:56px;color:var(--gold)}

/* Tableau tactique */
.learn-field{background:repeating-linear-gradient(90deg,var(--pitch) 0 32px,var(--pitch-2) 32px 64px);border-radius:18px;padding:16px 10px;min-height:120px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.balls{display:flex;flex-direction:column;gap:5px;width:100%}
.brow{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,26px)) 2.8em;gap:5px;justify-content:center;align-items:center}
.lb{aspect-ratio:1;width:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 30%,#D5DEEE 32%);box-shadow:0 2px 0 rgba(0,0,0,.3);transition:background .25s}
.brow.lit .lb{background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--tc) 21%)}
.rl{font:700 15px var(--f-score);color:#fff;opacity:0;transition:opacity .25s}
.brow.lit .rl{opacity:1}
.zero{font-family:var(--f-display);font-size:24px;text-align:center}
.stepper{display:grid;grid-template-columns:58px 1fr 58px;gap:10px;align-items:center;text-align:center}
.stepper button{height:58px;border-radius:16px;background:var(--night-3);font:400 32px var(--f-display);box-shadow:0 4px 0 #0B1838}
.stepper button:active{transform:translateY(3px);box-shadow:0 1px 0 #0B1838}
.stepper b{display:block;font-family:var(--f-display);font-size:36px;line-height:1;font-weight:400}
.learn-eq{text-align:center;font-family:var(--f-display);font-size:50px;line-height:1}
.learn-eq b{color:var(--gold);font-weight:400}
.learn-sum{text-align:center;color:var(--muted);font:600 16px var(--f-score);min-height:1.4em}
.tip{border:2px dashed rgba(255,200,61,.5);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tip-t{display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-size:20px;color:var(--gold)}
.tip-t svg{width:20px;height:20px}

/* Album, vestiaire */
.packbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--night-2);border-radius:18px;padding:12px;border:1px solid var(--line)}
.packbar .pill{font-size:22px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.pcard{aspect-ratio:3/4;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;background:linear-gradient(160deg,var(--night-3),var(--night));border:3px solid var(--rc);position:relative;box-shadow:0 0 18px -6px var(--rc)}
.pc-rar{font:700 10px var(--f-score);letter-spacing:.12em;text-transform:uppercase;color:var(--rc)}
.pc-ic{width:52%;color:var(--rc)}
.pc-ic svg{width:100%;height:auto}
.pc-n{font-family:var(--f-display);font-size:15px;line-height:1.1}
.pc-x{position:absolute;top:6px;right:6px;background:var(--rc);color:var(--ink);border-radius:99px;font:700 11px var(--f-score);padding:1px 6px}
.pcard.empty{border:2px dashed var(--line);box-shadow:none;--rc:var(--muted)}
.pcard.empty .pc-ic{font-family:var(--f-display);font-size:44px;color:var(--night-4);text-align:center}
.reveal .pcard{width:170px;margin:0 auto;animation:flip .7s cubic-bezier(.2,1.2,.4,1)}
.reveal .pc-n{font-size:20px}
.locker{display:flex;flex-direction:column;align-items:center;gap:12px}
.bigjersey svg{filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.locker .stepper{width:100%}
.jerseys{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.jbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:14px;background:var(--night-3);border:2px solid transparent;font-size:13px;font-weight:600}
.jbtn.on{border-color:var(--gold)}
.jbtn[aria-disabled="true"]{opacity:.45}

/* Progrès */
.medals{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 6px}
.medal{display:flex;flex-direction:column;align-items:center;gap:3px}
.medal span{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;background:radial-gradient(closest-side,var(--night-2) 74%,transparent 76%),conic-gradient(var(--tc) calc(var(--p)*1%),var(--night-3) 0)}
.medal small{font:600 11px var(--f-score);color:var(--muted);white-space:nowrap}
.medal.won span{background:radial-gradient(closest-side,var(--tc) 74%,transparent 76%),conic-gradient(var(--gold) 0 100%);color:var(--ink)}
.medal.locked{opacity:.4}
.mapwrap{overflow-x:auto}
table.map{border-collapse:separate;border-spacing:2px;margin:0 auto;font:600 11px var(--f-score)}
.map th{color:var(--muted);width:24px;height:22px;font-weight:700}
.map td{width:24px;height:24px;border-radius:5px}
.l-off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.l-new{background:var(--night-3)}
.l-low{background:#C2414F}
.l-mid{background:var(--orange)}
.l-good{background:#8AD43A}
.l-top{background:var(--green)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;padding:8px;border-radius:12px;background:var(--night-3);min-width:0}
.badge .bi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--night);color:var(--night-4)}
.badge.won .bi{background:var(--gold);color:var(--ink)}
.badge .bi svg{width:20px;height:20px}
.badge b{display:block;font-size:14px;line-height:1.2}
.badge small{font-size:12px;color:var(--muted);line-height:1.2;display:block}
.badge:not(.won){opacity:.6}
.records{display:flex;flex-direction:column;gap:6px}
.rec{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--night-3);font-size:14px}
.rec b{font-family:var(--f-score);text-align:right}

/* Parent */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpis b{display:block;font:700 28px var(--f-score);font-variant-numeric:tabular-nums}
.kpis small{color:var(--muted);font-size:12px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:150px}
.bar i{width:70%;background:var(--sky);border-radius:6px 6px 2px 2px;min-height:2px}
.bar em{font:700 12px var(--f-score);font-style:normal}
.bar small{font:600 11px var(--f-score);color:var(--muted)}
.tscroll{overflow-x:auto}
.ttable{width:100%;border-collapse:collapse;font-size:14px}
.ttable td,.ttable th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ttable th{font:700 11px var(--f-score);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ttable .num{text-align:right;font-family:var(--f-score);font-variant-numeric:tabular-nums}
.st{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.st-ok{background:rgba(61,220,132,.2);color:var(--green)}
.st-mid{background:rgba(255,159,28,.2);color:var(--orange)}
.st-new{background:var(--night-3);color:var(--muted)}
.st-off{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.minibar{height:8px;border-radius:99px;background:var(--night-3);overflow:hidden;min-width:60px}
.minibar i{display:block;height:100%;background:var(--tc)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;font-weight:500}
.sw{width:52px;height:30px;border-radius:99px;background:var(--night-3);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-pressed="true"] .sw{background:var(--green)}
.switch[aria-pressed="true"] .sw::after{transform:translateX(22px)}
input.txt{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--night);color:var(--chalk);font:500 16px var(--f-body)}
details.tips summary{cursor:pointer;font-weight:600;list-style-position:inside}
details.tips p{font-size:14px;color:var(--muted);margin-top:8px}
details.tips p b{color:var(--chalk)}

/* Pause active */
.breakbox{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.ring{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(closest-side,var(--night) 80%,transparent 82%),conic-gradient(var(--green) calc(var(--p)*1%),var(--night-3) 0);font:700 48px var(--f-score)}
.breakbox h2{font-size:28px;max-width:20ch}

 for(let i=0;i<(n||120);i++)CF.push({x:W/2+(Math.random()-.5)*W*.35,y:H*.35,vx:(Math.random()-.5)*16*dpr,vy:(-Math.random()*16-6)*dpr,r:(5+Math.random()*6)*dpr,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4,life:0,g:.5*dpr});
 if(!cfRaf)cfRaf=requestAnimationFrame(cfLoop);}

 if(CF.length)cfRaf=requestAnimationFrame(cfLoop);else{cfRaf=0;ctx.clearRect(0,0,fx.width,fx.height);}}

function mulHint(t,n){
 const p=t*n;
 if(t===0||n===0)return'Zéro fois n’importe quel nombre, ça fait toujours 0.';
 if(t===1||n===1)return`Multiplier par 1 ne change rien : ${p}.`;
 const pref=[2,10,5,4,3,9,6,7,8];const s=pref.find(x=>x===t||x===n);const o=s===t?n:t;let h;
 switch(s){
  case 2:h=`× 2, c’est le double : ${o} + ${o} = ${p}.`;break;
  case 3:h=`× 3, c’est le double plus une fois : ${2*o} + ${o} = ${p}.`;break;
  case 4:h=`× 4, c’est le double du double : ${o} → ${2*o} → ${p}.`;break;
  case 5:h=`Compte de 5 en 5 : ${range(1,o).map(i=>5*i).join(', ')}.`;break;
  case 6:h=`× 6, c’est × 5 plus une fois : ${5*o} + ${o} = ${p}.`;break;
  case 7:h=`× 7, c’est × 5 plus × 2 : ${5*o} + ${2*o} = ${p}.`;break;
  case 8:h=`× 8, c’est le double, trois fois : ${o} → ${2*o} → ${4*o} → ${p}.`;break;
  case 9:h=`× 9, c’est × 10 moins une fois : ${10*o} − ${o} = ${p}.`;break;
  case 10:h=`× 10 : les unités deviennent des dizaines. ${o} × 10 = ${p}.`;break;
 }
 if(t!==n)h+=` Et ${n} × ${t}, c’est pareil !`;
 return h;}
function mulQ(t,n,fmt,flip){
 const a=flip?n:t,b=flip?t:n,p=a*b;let parts=[a,'×',b],answer=p;
 if(fmt==='trou'){const sides=[];if(a!==0)sides.push('b');if(b!==0)sides.push('a');const sd=sides.length?pick(sides):null;
  if(sd==='b'){parts=[a,'×','?','=',p];answer=b;}else if(sd==='a'){parts=['?','×',b,'=',p];answer=a;}}
 return{kind:'mul',t,n,a,b,parts,answer,hint:mulHint(t,n)};}
function fmtOf(sens){return sens==='both'?(Math.random()<.5?'res':'trou'):sens;}
function pickFact(tables,mode,recent){
 recent=recent||[];let pool=[];
 for(const t of tables)for(let n=0;n<=10;n++){const lv=Math.max(factLevel(t,n),0);let w=mode==='smart'?Math.pow(6-lv,2):(6-lv);if(t<=1||n<=1)w*=.35;pool.push({t,n,w});}
 const f=pool.filter(p=>!recent.includes(p.t+','+p.n));if(f.length)pool=f;
 let sum=pool.reduce((s,p)=>s+p.w,0),r=Math.random()*sum;for(const p of pool){r-=p.w;if(r<=0)return p;}return pool[pool.length-1];}
function recentKeys(){return G?G.queue.slice(-3).filter(q=>q&&q.kind==='mul').map(q=>q.t+','+q.n):[];}

const SUB={1:[

 ()=>{const a=ri(4,9),b=ri(1,a-1);return Q([a*10,'−',b*10],(a-b)*10,`${a} dizaines − ${b} dizaines = ${a-b} dizaines.`);},

function genProblem(theme,level){
 const th=theme==='mix'?pick(['foot','jeu']):theme;
 const list=level===1?PROB[th][1]:PROB[th][2].concat(PROB[th][2],PROB[th][1]);
 let i,tries=0;do{i=Math.floor(Math.random()*list.length);tries++;}while(G&&G.lastTpl===th+i&&tries<6);
 if(G)G.lastTpl=th+i;const q=list[i]();q.theme=th;return q;}

 <div class="card"><div class="lbl">Table</div><div class="tchips">${range(0,10).map(t=>`<button class="tchip ${t===a?'on':''}" style="--tc:${TCOL[t]}" data-act="learn-a" data-arg="${t}" aria-pressed="${t===a}"><span>${t}</span></button>`).join('')}</div></div>
 <div class="learn-field">${grid}</div>
 <div class="stepper"><button data-act="learn-b" data-arg="-1" aria-label="Un ballon de moins">−</button><div><span class="lbl">Ballons par rangée</span><b>${b}</b></div><button data-act="learn-b" data-arg="1" aria-label="Un ballon de plus">+</button></div>
 <div class="learn-eq" id="leq">${a} × ${b} = <b>${LS.shown?p:'?'}</b></div>
 <div class="learn-sum" id="lsum">${LS.shown?sum:''}</div>
 <div class="row2"><button class="btn" data-act="learn-count">${IC.ball} Compter</button><button class="btn alt" data-act="learn-rotate">Tourner</button></div>
 <div class="tip"><div class="tip-t">${IC.bulb} L’astuce du ${a}</div><p>${TIPS[a]}</p></div>
 <div class="card"><div class="lbl">La file du ${a}</div><div class="file big">${range(0,10).map(n=>`<span style="--tc:${TCOL[a]}">${a*n}</span>`).join('')}</div></div>
 ${LS.plan?`<button class="btn block big green" data-act="learn-done">${IC.check} J’ai compris !</button>`:''}`;}

/* ========== Album, vestiaire, progrès ========== */
function cardHTML(c){const n=S.album[c.id]||0,R=RAR[c.r];return n?`<div class="pcard" style="--rc:${R.c}"><div class="pc-rar">${R.n}</div><div class="pc-ic">${CIC[c.ic]}</div><div class="pc-n">${c.n}</div>${n>1?`<div class="pc-x">×${n}</div>`:''}</div>`:`<div class="pcard empty"><div class="pc-rar">${R.n}</div><div class="pc-ic">?</div><div class="pc-n">À trouver</div></div>`;}
function album(){app.innerHTML=topBar('Album')+`
 <div class="packbar"><span class="pill">${IC.coin}<b>${S.coins}</b></span><button class="btn" data-act="pack" ${S.coins<PACK?'disabled':''}>Ouvrir une pochette · ${PACK}</button></div>
 <p class="help">Gagne des pièces en jouant. Chaque pochette contient une carte : bronze, argent, or ou légende. Un doublon te rend 10 pièces.</p>
 <div class="album">${CARDS.map(cardHTML).join('')}</div>`;}
function locker(){const L=levelInfo();app.innerHTML=topBar('Vestiaire')+`
 <div class="locker"><div class="bigjersey">${jerseySVG(170)}</div>
 <div class="stepper"><button data-act="num" data-arg="-1" aria-label="Numéro précédent">−</button><div><span class="lbl">Numéro</span><b>${S.num}</b></div><button data-act="num" data-arg="1" aria-label="Numéro suivant">+</button></div></div>
 <div class="card"><div class="lbl">Maillots</div><div class="jerseys">${JERSEYS.map(j=>{const lock=L.i<j.lvl;return`<button class="jbtn ${S.jersey===j.id?'on':''}" data-act="jersey" data-arg="${j.id}" ${lock?'aria-disabled="true"':''}>${jerseySVG(56,j)}<span>${lock?`Niveau ${j.lvl+1}`:j.n}</span></button>`;}).join('')}</div><p class="help">De nouveaux maillots se débloquent en montant de niveau.</p></div>`;}
function masteryMap(){let h='<div class="mapwrap"><table class="map"><thead><tr><th>×</th>'+range(0,10).map(n=>`<th>${n}</th>`).join('')+'</tr></thead><tbody>';
 for(let a=0;a<=10;a++){h+=`<tr><th style="color:${TCOL[a]}">${a}</th>`;for(let b=0;b<=10;b++){const inS=S.unlocked.includes(a)||S.unlocked.includes(b),lv=factLevel(a,b);const cls=!inS?'l-off':lv<0?'l-new':lv===0?'l-low':lv<=2?'l-mid':lv<=4?'l-good':'l-top';h+=`<td class="${cls}" title="${a} × ${b} = ${a*b}"></td>`;}h+='</tr>';}
 return h+'</tbody></table></div>';}
function progress(){const L=levelInfo();const won=BADGES.filter(b=>S.badges[b.id]).length;
 app.innerHTML=topBar('Trophées')+`
 <div class="card"><div class="lbl">Carrière</div><div style="display:flex;gap:12px;align-items:center">${jerseySVG(54)}<div style="flex:1;min-width:0"><b style="font-family:var(--f-display);font-size:22px;font-weight:400">Niveau ${L.i+1} · ${L.name}</b><div class="xpbar"><i style="width:${L.pct}%"></i></div><div class="xpnum">${S.stats.ok} bonnes réponses · ${S.stats.matches} matchs</div></div></div></div>
 <div class="card"><div class="lbl">Médailles des tables</div><div class="medals">${range(0,10).map(t=>{const mm=tableMastery(t),lock=!S.unlocked.includes(t);return`<div class="medal ${S.medals[t]?'won':''} ${lock?'locked':''}" style="--p:${Math.round(mm*100)};--tc:${TCOL[t]}"><span>${t}</span><small>${lock?'bientôt':Math.round(mm*100)+' %'}</small></div>`;}).join('')}</div><p class="help">Une table est maîtrisée quand presque tous ses calculs sont justes et rapides, plusieurs fois.</p></div>
 <div class="card"><div class="lbl">Carte de maîtrise</div>${masteryMap()}<div class="legend"><span><i class="l-new"></i>Pas encore vu</span><span><i class="l-low"></i>À revoir</span><span><i class="l-mid"></i>En cours</span><span><i class="l-good"></i>Acquis</span><span><i class="l-top"></i>Automatique</span></div></div>
 <div class="card"><div class="lbl">Records chrono</div><div class="records">${Object.entries(FMT).map(([k,f])=>`<div class="rec"><span>${f.n} · ${f.target} en ${f.sec/60} min</span><b>${S.records[k]?recText(S.records[k]):'–'}</b></div>`).join('')}</div></div>
 <div class="card"><div class="lbl">Trophées · ${won} sur ${BADGES.length}</div><div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b.id]?'won':''}"><span class="bi">${IC.trophy}</span><div><b>${b.n}</b><small>${b.d}</small></div></div>`).join('')}</div></div>`;}

/* ========== Programme ========== */
function plan(){const cur=currentDay();
 app.innerHTML=topBar('Stage Toussaint')+`<p class="lead">10 jours pour maîtriser les tables de 0 à 5. Environ 15 minutes par jour, en petits matchs avec une pause entre deux.</p>`+
 PLAN.map((day,d)=>{const done=dayDone(d),unl=dayUnlocked(d);return`<div class="day ${done?'done':''} ${!unl?'locked':''} ${d===cur&&unl?'cur':''}"><div class="day-h"><span class="day-n">J${d+1}</span><div><h3>${day.t}</h3><p>${day.goal}</p></div>${done?IC.check:!unl?IC.lock:''}</div>${unl?`<div class="day-steps">${day.steps.map((st,s)=>`<button class="stepbtn ${stepDone(d,s)?'ok':''}" data-act="plan-step" data-arg="${d}-${s}"><span class="sb-ic">${stepDone(d,s)?IC.check:s+1}</span><span>${st.l}</span></button>`).join('')}</div>`:''}</div>`;}).join('')+
 `<div class="card finale">${IC.trophy}<b style="font-family:var(--f-display);font-size:20px;font-weight:400">Trophée « Stage réussi »</b><p class="help">À la rentrée : le défi de la maîtresse, 120 calculs en 10 minutes.</p></div>`;}

/* ========== Espace parent ========== */
function switchBtn(key,label){return`<button class="switch" data-act="toggle" data-arg="${key}" aria-pressed="${!!S[key]}"><span>${label}</span><span class="sw"></span></button>`;}
function parentScreen(){
 const days=range(0,6).map(i=>addDays(today(),i-6)),vals=days.map(d=>S.days[d]||{ok:0,ko:0,ms:0}),max=Math.max(10,...vals.map(v=>v.ok));
 const tot7=vals.reduce((s,v)=>s+v.ok,0),min7=Math.round(vals.reduce((s,v)=>s+v.ms,0)/60000);const DN=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
 const bars=vals.map((v,i)=>{const[y,mo,dd]=days[i].split('-').map(Number);return`<div class="bar"><em>${v.ok||''}</em><i style="height:${Math.round(v.ok/max*110)}px"></i><small>${DN[new Date(y,mo-1,dd).getDay()]}</small></div>`;}).join('');
 const rows=range(0,10).map(t=>{const lock=!S.unlocked.includes(t),mm=tableMastery(t);const ts=[];for(let n=0;n<=10;n++)for(const k of[t+','+n,n+','+t]){const f=S.facts[k];if(f&&f.t)ts.push(f.t);}
  const avg=ts.length?dec(ts.reduce((a,b)=>a+b,0)/ts.length/1000)+' s':'–';const seen=range(0,10).some(n=>factLevel(t,n)>=0);
  const st=lock?['st-off','Verrouillée']:S.medals[t]?['st-ok','Maîtrisée']:seen?['st-mid','En cours']:['st-new','À découvrir'];
  return`<tr><td><b style="color:${TCOL[t]}">× ${t}</b></td><td><div class="minibar" style="--tc:${TCOL[t]}"><i style="width:${Math.round(mm*100)}%"></i></div></td><td class="num">${Math.round(mm*100)} %</td><td class="num">${avg}</td><td><span class="st ${st[0]}">${st[1]}</span></td></tr>`;}).join('');
 const weak=Object.entries(S.facts).filter(([,f])=>f.w>0).sort((a,b)=>a[1].box-b[1].box||b[1].w-a[1].w).slice(0,10);
 const ch=S.chronoHist.slice(0,6).map(h=>`<div class="rec"><span>${FMT[h.fmt]?FMT[h.fmt].n:''} · ${frDate(h.date)}</span><b>${h.ok} justes${h.ms?' · '+fmtClock(h.ms):''}</b></div>`).join('')||'<p class="help">Aucun défi chrono pour l’instant.</p>';
 app.innerHTML=topBar('Espace parent')+`
 <div class="card"><div class="lbl">7 derniers jours</div>
  <div class="kpis"><div><b>${S.streak.count||0}</b><small>jours d’affilée</small></div><div><b>${tot7}</b><small>calculs justes</small></div><div><b>${min7}</b><small>minutes de jeu</small></div></div>
  <div class="bars">${bars}</div><p class="help">Calculs justes par jour (échelle : 0 à ${max}).</p></div>
 <div class="card"><div class="lbl">Maîtrise par table</div><div class="tscroll"><table class="ttable"><thead><tr><th>Table</th><th>Maîtrise</th><th class="num">%</th><th class="num">Temps</th><th>État</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="help">Un calcul est acquis après plusieurs réponses justes en moins de 6 secondes. Le rythme attendu en classe est de 5 secondes par calcul.</p></div>
 <div class="card"><div class="lbl">Calculs à retravailler</div>${weak.length?`<div class="chiplist left">${weak.map(([k,f])=>{const[a,b]=k.split(',');return`<span class="fchip">${a} × ${b} <small>${f.w} err.</small></span>`;}).join('')}</div>`:'<p class="help">Rien à signaler pour l’instant.</p>'}</div>
 <div class="card"><div class="lbl">Défis chrono récents</div><div class="records">${ch}</div></div>
 <div class="card"><div class="lbl">Réglages</div>
  <label class="help" for="set-name">Prénom affiché</label><input class="txt" id="set-name" value="${esc(S.name)}" maxlength="16" autocomplete="off">
  <div class="lbl" style="margin-top:6px">Tables disponibles</div>
  <div class="tchips">${range(0,10).map(t=>`<button class="tchip ${S.unlocked.includes(t)?'on':''}" style="--tc:${TCOL[t]}" data-act="unlock" data-arg="${t}" ${t<=5?'disabled':''} aria-pressed="${S.unlocked.includes(t)}"><span>${t}</span></button>`).join('')}</div>
  <p class="help">Les tables 0 à 5 restent actives. Ouvrez les tables 6 à 10 après la Toussaint : elles apparaîtront dans tous les modes et dans les problèmes.</p>
  ${switchBtn('sound','Sons')}${switchBtn('auto','Validation automatique de la réponse')}${switchBtn('freePlan','Stage : ouvrir le jour suivant sans attendre le lendemain')}
  <div id="resetzone" style="margin-top:6px"><button class="btn block alt" data-act="reset-ask">Remettre la progression à zéro</button></div>
 </div>
 <details class="card tips"><summary>Repères du programme et conseils</summary>
  <p><b>Programme 2025 (cycle 2).</b> En fin de CE2, l’élève connaît les tables de multiplication dans les deux sens (5 × 4 = 20, mais aussi 20 = 5 × 4 et 5 × ? = 20). Repère officiel : 12 égalités en 1 minute. Le défi de la maîtresse (120 calculs en 10 minutes) correspond au même rythme, 5 secondes par calcul.</p>
  <p><b>Calcul mental CE2 en milieu d’année.</b> Nombres jusqu’à 1 000 : passage de la dizaine (47 + 8), + 9 et + 19, compléments à 100, ajout et retrait de dizaines et de centaines, doubles et moitiés, multiplication par 10.</p>
  <p><b>Format court.</b> 2 ou 3 matchs de 2 à 4 minutes, séparés par une pause active. Une séance quotidienne de 12 à 15 minutes est plus efficace qu’une longue séance le week-end.</p>
  <p><b>Erreurs.</b> Chaque erreur affiche la bonne réponse et une stratégie, puis le calcul revient trois questions plus tard. La révision maline cible ensuite les calculs fragiles.</p>
  <p><b>Chrono.</b> C’est un défi, pas une note. Félicitez la régularité et les progrès sur le record personnel.</p>
  <p><b>Après la Toussaint.</b> Ouvrez la table de 6 ici, puis 7, 8, 9 et 10, une à la fois. Le tableau tactique montre déjà comment les construire à partir des tables connues.</p>
 </details>`;}

/* ========== Actions ========== */
const ACT={
 go:a=>{if(a==='learn')LS={a:LS.a,b:LS.b,shown:false,plan:null};go(a);},
 holdhint:()=>showBanner('Garde le doigt appuyé','2 secondes pour ouvrir','info'),
 opt:a=>{const[g,k,v]=a.split('|');S.setup[g][k]=/^\d+$/.test(v)?+v:v;save();render();},
 tbl:a=>{const[g,t]=a.split('|'),n=+t;if(!S.unlocked.includes(n)){showBanner('Bientôt !','Table à ouvrir dans l’espace parent','info');return;}const arr=S.setup[g].tables;const i=arr.indexOf(n);if(i>=0){if(arr.length>1)arr.splice(i,1);}else arr.push(n);arr.sort((x,y)=>x-y);save();render();},
 preset:a=>{const[g,v]=a.split('|');const ts=v.split(',').map(Number).filter(t=>S.unlocked.includes(t));if(ts.length)S.setup[g].tables=ts;save();render();},
 start:a=>startGame(Object.assign({},S.setup[a],{mode:a,tables:S.setup[a].tables?S.setup[a].tables.slice():undefined})),
 'start-preset':()=>startGame({mode:'tables',tables:T05.slice(),order:'smart',sens:'both',len:20}),
 key:a=>press(a),
 next:()=>{if(!G)return;$('#pad').hidden=false;next();},
 speak:()=>{if(G)speak(curQ().text);},
 hint:()=>{const h=$('#phint');if(h){h.hidden=false;const b=$('#hintbtn');if(b)b.hidden=true;}},
 quit:()=>{if(!G||!modalEl.hidden)return;G.wasRunning=!!G.running;if(G.cfg.mode==='chrono')pauseClock();openModal(`<div class="mbox"><h2>Quitter le match ?</h2><p class="help">Les calculs déjà faits sont gardés dans tes progrès.</p><button class="btn block green" data-act="quit-no">Continuer le match</button><button class="btn block alt" data-act="quit-yes">Quitter</button></div>`);},
 'quit-no':()=>{closeModal();if(G&&G.wasRunning)resumeClock();},
 'quit-yes':()=>{if(G){clearInterval(G.timer);clearInterval(G.htIv);clearTimeout(G.to);}G=null;save();go('home');},
 'resume-half':()=>{if(!G)return;clearInterval(G.htIv);closeModal();countdown(()=>resumeClock());},
 replay:()=>{if(RES)startGame(Object.assign({},RES.g.cfg,{plan:null}));},
 'plan-step':a=>{const[d,s]=a.split('-').map(Number);if(!dayUnlocked(d)){showBanner('Patience !','Ce jour s’ouvre plus tard','info');return;}const c=Object.assign({},PLAN[d].steps[s].c,{plan:{d,s}});if(c.tables)c.tables=c.tables.slice();if(c.mode==='learn'){LS={a:c.a,b:4,shown:false,plan:c.plan};go('learn');}else startGame(c);},
 'learn-a':a=>{clearTimers();LS.a=+a;LS.shown=false;render();},
 'learn-b':a=>{clearTimers();LS.b=Math.max(0,Math.min(10,LS.b+ +a));LS.shown=false;render();},
 'learn-count':()=>{clearTimers();const rows=$$('.brow');rows.forEach(r=>r.classList.remove('lit'));LS.shown=false;$('#leq').innerHTML=`${LS.a} × ${LS.b} = <b>?</b>`;$('#lsum').textContent='';
  const fin=()=>{LS.shown=true;const p=LS.a*LS.b;$('#leq').innerHTML=`${LS.a} × ${LS.b} = <b>${p}</b>`;$('#lsum').textContent=LS.a&&LS.b?`${Array(LS.a).fill(LS.b).join(' + ')} = ${p}`:'0';sfx('goal');};
  const step=REDUCED?60:420;rows.forEach((r,i)=>TIMERS.push(setTimeout(()=>{r.classList.add('lit');sfx('tick');},i*step)));TIMERS.push(setTimeout(fin,rows.length*step+100));},
 'learn-rotate':()=>{clearTimers();const el=$('#balls');const swap=()=>{[LS.a,LS.b]=[LS.b,LS.a];LS.shown=true;render();showBanner(`${LS.a} × ${LS.b} = ${LS.a*LS.b}`,'Même résultat en tournant !','info',1800);};
  if(el&&el.animate&&!REDUCED){const an=el.animate([{transform:'rotate(0deg)',opacity:1},{transform:'rotate(90deg) scale(.75)',opacity:.2}],{duration:380,easing:'ease-in'});an.onfinish=swap;}else swap();},
 'learn-done':()=>{if(!LS.plan)return;const{d,s}=LS.plan;S.plan[d+'-'+s]=today();if(dayDone(d)&&!S.planDays[d])S.planDays[d]=today();S.xp+=20;S.coins+=5;touchDay();checkBadges();save();LS.plan=null;go('plan');showBanner('Étape validée','+20 XP · +5 pièces','info',1600);confetti(70);sfx('win');},
 pack:()=>{if(S.coins<PACK)return;S.coins-=PACK;S.stats.packs++;const r=Math.random();let ri_=RAR.length-1,acc=0;for(let i=0;i<RAR.length;i++){acc+=RAR[i].p;if(r<acc){ri_=i;break;}}
  const c=pick(CARDS.filter(x=>x.r===ri_)),dup=!!S.album[c.id];S.album[c.id]=(S.album[c.id]||0)+1;if(dup)S.coins+=10;checkBadges();save();sfx('card');if(ri_>=1)confetti(ri_>=2?160:80);
  openModal(`<div class="mbox reveal"><div class="lbl">${dup?'Doublon':'Nouvelle carte !'}</div>${cardHTML(c)}<p class="help">${dup?'Tu l’avais déjà : 10 pièces te sont rendues.':`Carte ${RAR[c.r].n.toLowerCase()} ajoutée à ton album.`}</p><button class="btn block" data-act="modal-close">Super !</button></div>`);},
 'modal-close':()=>{closeModal();render();},
 jersey:a=>{const j=JERSEYS.find(x=>x.id===a);if(levelInfo().i<j.lvl){showBanner('Pas encore',`Maillot du niveau ${j.lvl+1}`,'info');return;}S.jersey=a;save();render();},
 num:a=>{S.num=((S.num-1+ +a+99)%99)+1;save();render();},
 'break-done':()=>{S.coins+=5;S.sinceBreak=0;save();go('home');showBanner('Rechargé !','+5 pièces','info');},
 toggle:a=>{S[a]=!S[a];if(a==='sound'&&S.sound)audioInit();save();render();},
 unlock:a=>{const t=+a;if(t<=5)return;const i=S.unlocked.indexOf(t);if(i>=0){S.unlocked.splice(i,1);for(const g of['tables','chrono']){S.setup[g].tables=S.setup[g].tables.filter(x=>x!==t);if(!S.setup[g].tables.length)S.setup[g].tables=T05.slice();}}else S.unlocked.push(t);S.unlocked.sort((x,y)=>x-y);save();render();},
 'reset-ask':()=>{$('#resetzone').innerHTML=`<p class="help">Toute la progression de ${esc(S.name)} sera effacée.</p><div class="row2" style="margin-top:8px"><button class="btn alt" data-act="reset-no">Annuler</button><button class="btn danger" data-act="reset-yes">Effacer</button></div>`;},
 'reset-no':()=>render(),
 'reset-yes':()=>{S=blank();save();go('home');}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled||el.getAttribute('aria-disabled')==='true'&&!['tbl','jersey'].includes(el.dataset.act))return;audioInit();const f=ACT[el.dataset.act];if(f)f(el.dataset.arg,el,e);});
let holdT=0;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-hold]');if(!h)return;h.classList.add('holding');holdT=setTimeout(()=>{holdT=0;h.classList.remove('holding');go('parent');},1800);});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(holdT){clearTimeout(holdT);holdT=0;}$$('.holding').forEach(x=>x.classList.remove('holding'));}));
document.addEventListener('input',e=>{if(e.target.id==='set-name'){S.name=e.target.value.trim().slice(0,16)||'Carlo';save();}});
document.addEventListener('keydown',e=>{if(SCREEN!=='game'||!G||!modalEl.hidden)return;
 if(/^[0-9]$/.test(e.key)){press(e.key);e.preventDefault();}
 else if(e.key==='Backspace'){press('del');e.preventDefault();}
 else if(e.key==='Enter'){e.preventDefault();if($('#nextbtn'))ACT.next();else press('ok');}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.running&&modalEl.hidden)ACT.quit();});

render();
</script>
