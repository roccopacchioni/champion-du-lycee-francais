<style>
/* Mise en page : une colonne type application mobile ; la ligne du bus mène de la gare jusqu'au stade de Wembley. */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#E2E7F1; --ink:#16213A; --muted:#57627A; --line:#C9D1E1;
  --main:#1F3A7A; --on-main:#FFFFFF; --red:#C8202F; --red-soft:#FBDADC; --gold:#D99A1E;
  --good:#1F8556; --good-soft:#DCF2E5; --bad:#C2432E; --bad-soft:#FADFD8;
  --plate:#F7F4EC; --plate-line:#E3DCCB;
  --s-pos:#C8202F; --s-adj:#7647AE;
  --f-display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Andika","Trebuchet MS",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1424; --surface:#18203A; --surface-2:#222C4A; --ink:#EAF0FA; --muted:#A7B1C8; --line:#33405F;
    --main:#8FB1FF; --on-main:#0B1430; --red:#FF6B74; --red-soft:#42202A; --gold:#F2C25B;
    --good:#4DCB8C; --good-soft:#153A2B; --bad:#FF7D66; --bad-soft:#43221C;
    --plate:#F4EFE3; --plate-line:#CFC5AE;
    --s-pos:#FF8A92; --s-adj:#B795EE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1424; --surface:#18203A; --surface-2:#222C4A; --ink:#EAF0FA; --muted:#A7B1C8; --line:#33405F;
  --main:#8FB1FF; --on-main:#0B1430; --red:#FF6B74; --red-soft:#42202A; --gold:#F2C25B;
  --good:#4DCB8C; --good-soft:#153A2B; --bad:#FF7D66; --bad-soft:#43221C;
  --plate:#F4EFE3; --plate-line:#CFC5AE;
  --s-pos:#FF8A92; --s-adj:#B795EE; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  -webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:3px solid var(--main);outline-offset:2px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 20px;border-radius:16px;border:0;
  font-family:var(--f-display);font-size:20px;background:var(--main);color:var(--on-main);box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--surface);flex:none}
.icon-btn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.chip svg{width:22px;height:22px}
.subj{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:2px solid currentColor}
.subj.pos{color:var(--s-pos)} .subj.adj{color:var(--s-adj)}

/* Accueil */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hello{margin:6px 0 2px}
.hello .eyebrow{font-size:14px;color:var(--muted);font-weight:700}
.hello .who{font-family:var(--f-display);font-size:34px;line-height:1.05}
.hello .who span{color:var(--red)}
.countdown{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.countdown .big{font-family:var(--f-display);font-size:34px;color:var(--red);font-variant-numeric:tabular-nums;min-width:64px;text-align:center;white-space:nowrap}
.garage{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin:8px 0 16px}
.garage svg{width:150px;height:auto}
.garage .pax-new{animation:drop .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.today{background:var(--main);color:var(--on-main);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;border:0;width:100%;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.today .lab{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:700}
.today h3{font-size:22px}
.plate{background:var(--plate);border:2px solid var(--plate-line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.plate svg{width:100%;height:100%;display:block}
.plate.sm{width:60px;height:60px;padding:5px}
.plate.md{width:76px;height:76px;padding:6px}
.plate.big{width:min(200px,60vw);aspect-ratio:1;padding:12px;margin:0 auto;max-width:100%}
.section-title{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px;flex-wrap:wrap}
.section-title h2{font-size:24px}
.map{position:relative;display:grid;gap:12px;padding-left:34px}
.map::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:10px;border-radius:6px;background:linear-gradient(var(--red),var(--main))}
.mission{position:relative;display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 12px}
.mission::before{content:"";position:absolute;left:-30px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--surface);border:4px solid var(--ink)}
.mission.done::before{background:var(--red);border-color:var(--red)}
.mission h3{font-size:19px;line-height:1.15;margin:2px 0}
.mission .sub{font-size:14px;color:var(--muted)}
.mission.next{border-color:var(--main);box-shadow:0 0 0 3px color-mix(in srgb,var(--main) 25%,transparent)}
.stars{display:flex;gap:2px}
.stars svg{width:20px;height:20px}
.extra{display:grid;gap:12px;margin-top:22px}
.card-btn{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px}
.card-btn h3{font-size:20px}
.card-btn .sub{font-size:14px;color:var(--muted)}
.card-btn.boss{background:var(--red-soft);border-color:var(--red)}
.ico{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--surface-2)}
.ico svg{width:40px;height:40px}
.ico.art{background:var(--plate);padding:6px}
.ico.art svg{width:100%;height:100%}

/* Jeu */
.playbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.dot{height:10px;flex:1;min-width:8px;border-radius:6px;background:var(--line)}
.dot.ok{background:var(--good)} .dot.ko{background:var(--bad)} .dot.cur{background:var(--main)}
.combo{font-family:var(--f-display);color:var(--red);font-size:18px;white-space:nowrap}
.combo.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.prompt{font-family:var(--f-display);font-size:24px;line-height:1.25;margin:4px 0 12px;text-wrap:balance}
.ctx{font-family:var(--f-body);font-weight:700;font-size:25px;line-height:1.35;background:var(--plate);color:#22263A;border:2px solid var(--plate-line);border-radius:16px;padding:14px 16px;margin:10px 0 4px;text-wrap:pretty}
.ctx[lang="en"]{}
.ctx b{color:#B3202D}
.ctx .src{display:block;font-size:18px;font-weight:400;color:#6A6152;margin-bottom:6px}
.ctx .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid #B3202D;color:#B3202D;text-align:center;line-height:1.1}
.ctx .gap.cur{background:#FFE3E5;border-radius:6px 6px 0 0;padding:0 6px;min-width:4em}
.ctx .gap.done{border-bottom-color:transparent;color:#1A6B45}
.ctx .fr{font-weight:400;font-style:italic;color:#6A6152}
.ctx mark{background:#FFE08A;color:#22263A;border-radius:5px;padding:0 3px}
.caret{display:inline-block;width:2px;height:1em;background:#B3202D;vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.two .choice{justify-content:center;text-align:center;min-height:72px}
.choices.two.big .choice{font-size:30px}
.choice{min-height:58px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px}
.choice:active{transform:scale(.99)}
.choice.ok{background:var(--good-soft);border-color:var(--good)}
.choice.ko{background:var(--bad-soft);border-color:var(--bad)}
.choice:disabled{cursor:default}
.hint-row{display:flex;gap:10px;margin-top:14px}
.hint{margin-top:12px;background:var(--red-soft);border:2px dashed var(--red);border-radius:14px;padding:12px 14px;font-size:17px}
.hint p{margin:4px 0}
.rule{display:grid;gap:6px;font-size:16px;margin-top:6px}
.rule div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.rule b{color:var(--red);font-size:18px;white-space:nowrap}
.order{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.order span{display:inline-flex;flex-direction:column;align-items:center;padding:4px 8px;border-radius:10px;color:#fff;font-weight:700;font-size:15px;line-height:1.1}
.order span small{font-weight:400;font-size:11px;opacity:.9}

/* Flash */
.flashbar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:10px 0}
.flashbar i{display:block;height:100%;background:var(--red);width:100%;transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.flashword{font-size:36px;text-align:center;padding:22px 12px}
.eyehint{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:700;color:var(--muted);font-size:15px}

/* Construction */
.build-out{min-height:72px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;
  background:var(--plate);color:#22263A;border:2px solid var(--plate-line);border-radius:16px;margin:10px 0 12px;padding:8px 12px;text-align:center;line-height:1.25}
.build-out.empty{font-size:16px;color:#7A6E55;font-weight:400}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.tile{min-width:52px;min-height:52px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:22px}
.tile:disabled{opacity:.22}
.tile.apo{min-width:64px;font-size:34px;line-height:1;background:var(--red-soft);border-color:var(--red)}

/* Clavier */
.kb{display:grid;gap:6px;user-select:none;-webkit-user-select:none;margin-top:10px}
.kb .r{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.key{min-height:46px;border-radius:10px;background:var(--surface);box-shadow:0 2px 0 var(--line);font-size:20px;font-weight:700;padding:0;min-width:0;border:1px solid var(--line)}
.key:active{background:var(--surface-2);transform:translateY(1px)}
.key.apo{background:var(--red-soft);font-size:28px;border-color:var(--red)}
.key.shift.on{background:var(--main);color:var(--on-main)}
.key.w2{grid-column:span 2} .key.w5{grid-column:span 5}
.key.go{background:var(--main);color:var(--on-main);font-family:var(--f-display);font-size:19px;font-weight:400;border:0}
.key svg{width:22px;height:22px;vertical-align:middle}

/* Feuille de réponse */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:4px solid var(--good);border-radius:22px 22px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 30px rgba(0,0,0,.18);animation:up .22s ease-out;max-height:80vh;overflow:auto}
.sheet.ko{border-top-color:var(--bad)}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:10px}
.sheet h3{font-size:26px;color:var(--good)}
.sheet.ko h3{color:var(--bad)}
.sheet p{margin:0;font-size:17px}
.sheet .fix{font-size:24px;font-weight:700}
.sheet .fix mark{background:var(--bad-soft);color:var(--bad);border-bottom:3px solid var(--bad);border-radius:3px;padding:0 1px}
.sheet .yours{text-decoration:line-through;color:var(--muted);font-weight:700}
.gain{font-family:var(--f-display);color:var(--red);font-size:20px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.pad-bottom{height:260px}

/* Résultats, pause, album */
.center{text-align:center}
.bigstars{display:flex;justify-content:center;gap:8px;margin:12px 0}
.bigstars svg{width:62px;height:62px}
.bigstars svg.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.result-card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0;display:grid;gap:10px}
.unlocked{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.unlocked .plate{animation:pop .5s .2s cubic-bezier(.3,1.6,.5,1) both}
.objlist{display:grid;gap:8px;text-align:left}
.objrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:15px}
.ring{width:170px;height:170px;margin:10px auto;display:block}
.album{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px;text-align:left;display:grid;gap:6px;min-width:0}
.acard .plate{width:100%;aspect-ratio:1;padding:12px}
.acard.locked .plate svg{filter:grayscale(1) brightness(.2);opacity:.25}
.acard h3{font-size:16px;line-height:1.15}
.acard .when{font-size:13px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border-radius:22px;padding:18px;max-width:520px;width:100%;display:grid;gap:12px;max-height:90vh;overflow:auto;animation:up .22s ease-out}
.modal .box b{color:var(--red)}

/* Parents */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.panel h3{font-size:20px;margin-bottom:8px}
.panel p{margin:8px 0;font-size:16px}
.obj{display:grid;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.obj:last-child{border-bottom:0}
.obj .top2{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:15px}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.a{background:var(--good-soft);color:var(--good)} .pill.b{background:var(--red-soft);color:var(--red)} .pill.c{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--surface-2);color:var(--muted)}
.plan{display:grid;gap:6px}
.plan .d{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:15px}
.plan .d.now{outline:3px solid var(--main)}
.plan .dt{font-weight:700;font-variant-numeric:tabular-nums}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:16px}
.toggle input[type=checkbox]{width:24px;height:24px;accent-color:var(--main)}
.toggle input[type=date]{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px}
.confirm{display:grid;gap:8px;margin-top:10px;background:var(--bad-soft);border-radius:12px;padding:10px;font-size:15px}
</style>

</div>

<script>
/* =========================================================
   London Express — anglais, CE2 (cahier d'anglais, leçons 4 et 6)
   Apostrophes for possession · Expanded noun phrases (adjectives)
   ========================================================= */
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const one = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const norm = s => String(s).replace(/[’`´‘]/g, "'").replace(/\s+/g, " ").replace(/\s*'\s*/g, "'").replace(/[.!]+$/, "").trim().toLowerCase();
const normNC = s => norm(String(s).replace(/,/g, " "));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Dessins ---------- */
const V = (inner, vb = "0 0 100 100") => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
const ART = {
  bus: V(`<rect x="8" y="20" width="84" height="60" rx="9" fill="#C8202F"/><rect x="8" y="48" width="84" height="5" fill="#8E1520"/>

const sentence = ([o, det, , obj, pl]) => `The ${obj} ${pl ? "belong" : "belongs"} to ${det}${o}.`;
const answerOf = ([o, det, k, obj, pl]) => `${pron(pl)} ${det}${poss(o, k)} ${obj}`;
const objOf = k => ({ s: "P1", p: "P2", i: "P3" })[k];
function why([o, det, k]) {
  if (k === "s") return `Un seul propriétaire (<b>${det}${o}</b>) : on ajoute <b>'s</b> → ${det}<b>${o}'s</b>.`;
  if (k === "p") return `Plusieurs propriétaires, et <b>${o}</b> finit déjà par s : on ajoute seulement <b>'</b> → the <b>${o}'</b>.`;
  return `<b>${o}</b> est un pluriel qui ne finit pas par s : on ajoute <b>'s</b>, comme pour un seul → the <b>${o}'s</b>.`;
}
const whyPron = pl => pl ? "Plusieurs choses → <b>They are</b>." : "Une seule chose → <b>It is</b>.";

function mcq(o) { return Object.assign({ type: "mcq" }, o); }

/* Mission 1 : un seul propriétaire */
const FRB = [["le ballon de mon frère", "brother", "my ", "ball"], ["le livre de Ben", "Ben", "", "book"], ["le chat de Clara", "Clara", "", "cat"],
  ["le sifflet de l'entraîneur", "coach", "the ", "whistle"], ["les gants du gardien", "goalkeeper", "the ", "gloves"], ["le vélo de ma sœur", "sister", "my ", "bike"],
  ["l'os du chien", "dog", "the ", "bone"], ["la queue du chat", "cat", "the ", "tail"], ["le cerf-volant de Harry", "Harry", "", "kite"], ["le bureau de la maîtresse", "teacher", "the ", "desk"]];
function genM1() {
  const a = ITEMS.filter(it => it[2] === "s").map(it => {
    const [o, det, , obj, pl] = it; const right = `${det}${o}'s ${obj}`;
    const opts = shuffle([right, `${det}${o}s ${obj}`, `${det}${o}s' ${obj}`, `the ${obj} of ${det}${o}`]);
    return mcq({ obj: "P1", prompt: "Quelle est la bonne réponse ?", ctx: `<span class="src">${sentence(it)}</span>${pron(pl)} <span class="gap">……</span>`, choices: opts, answer: opts.indexOf(right), correct: right,
      hintHtml: RULE_POSS, explain: why(it) + ` En anglais, on ne dit pas « the ${obj} of ${det}${o} ».`, say: [FR("Quelle est la bonne réponse ?"), EN(sentence(it))], sayAns: `${pron(pl)} ${right}.` });
  });
  const b = FRB.map(([fr, o, det, obj]) => {
    const right = `${det}${o}'s ${obj}`;
    const opts = shuffle([right, `the ${obj} of ${det}${o}`, `${det}${o}s ${obj}`, `${det}${o} ${obj}`]);
    return mcq({ obj: "P1", prompt: "Comment dit-on en anglais ?", ctx: `<span class="fr">${fr}</span>`, choices: opts, answer: opts.indexOf(right), correct: right, hintHtml: RULE_POSS,
      explain: `En anglais, le propriétaire vient <b>avant</b> l'objet, avec <b>'s</b> : <b>${right}</b>. « the ${obj} of ${det}${o} » est une traduction mot à mot du français.`, say: [FR("Comment dit-on en anglais : " + fr + " ?")], sayAns: right });
  });
  return [a, b];
}

/* Mission 2 : un ou plusieurs propriétaires ? */
const NOUNS2 = [["girl", "hats", "fille", "filles"], ["boy", "pens", "garçon", "garçons"], ["dog", "bones", "chien", "chiens"], ["cat", "toys", "chat", "chats"],

function genM2() {
  const a = NOUNS2.map(([s, obj, f1, fp]) => {
    const plural = Math.random() < .5; const w = plural ? s + "s'" : s + "'s";
    const opts = [`1 ${f1}`, `plusieurs ${fp}`];
    return mcq({ obj: "P2", two: true, prompt: `Combien de ${fp} ?`, ctx: `the <b>${w}</b> ${obj}`, choices: opts, answer: plural ? 1 : 0, correct: opts[plural ? 1 : 0], hintHtml: RULE_POSS,
      explain: plural ? `<b>${s}s'</b> : le mot est déjà au pluriel (${s}s) et l'apostrophe vient <b>après</b> le s → plusieurs ${fp}.` : `<b>${s}'s</b> : l'apostrophe vient <b>avant</b> le s → un seul ${f1}.`,
      say: [FR(`Combien de ${fp} ?`), EN(`the ${w} ${obj}`)], sayAns: `the ${w} ${obj}` });

  const b = ITEMS.filter(it => it[1] && (it[2] === "p" || it[2] === "s")).map(it => {
    const [o, det, k, obj] = it;
    const right = `${det}${poss(o, k)} ${obj}`;
    const wrong = k === "p" ? [`${det}${sing(o)}'s ${obj}`, `${det}${o}'s ${obj}`] : [`${det}${o}s' ${obj}`, `${det}${o}s ${obj}`];
    const opts = shuffle([right, ...wrong]);
    return mcq({ obj: objOf(k), prompt: "Choisis la bonne écriture", ctx: sentence(it), choices: opts, answer: opts.indexOf(right), correct: right, hintHtml: RULE_POSS, explain: why(it),
      say: [FR("Choisis la bonne écriture."), EN(sentence(it))], sayAns: right });
  });
  return [a, b];
}

let AC = null;
function tone(seq) {
  if (!ST.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02); t += d * 0.85; });
  } catch (e) {}
}
const sndOk = () => tone([[660, .12], [880, .12], [1175, .22]]);
const sndKo = () => tone([[300, .18], [240, .26]]);

function plain(html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent; }
let VOICES = [];
function loadVoices() { try { VOICES = speechSynthesis.getVoices() || []; } catch (e) {} }
try { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
function pickVoice(lang) {
  const L = lang.toLowerCase(), base = L.slice(0, 2);
  const ok = v => v.lang && v.lang.replace("_", "-").toLowerCase();
  return VOICES.find(v => ok(v) === L) || VOICES.find(v => ok(v) && ok(v).startsWith(base)) || null;
}
function speak(parts) {

    speechSynthesis.cancel();
    if (typeof parts === "string") parts = [FR(parts)];
    parts.forEach(([lang, txt]) => {
      if (!txt) return;
      const u = new SpeechSynthesisUtterance(plain(txt));
      u.lang = lang === "en" ? "en-GB" : "fr-FR";
      const v = pickVoice(u.lang); if (v) u.voice = v;
      u.rate = lang === "en" ? 0.8 : 0.9;
      speechSynthesis.speak(u);
    });
  } catch (e) {}
}

/* ---------- Partie ---------- */
let S = null, KB = null;
function start(id) {
  let queue, title;
  if (id === "boss") { queue = buildBoss(); title = "Le Test de Wembley"; }
  else if (id === "revanche") { if (!ST.missed.length) return; queue = shuffle(ST.missed).slice(0, 8).map(q => JSON.parse(JSON.stringify(q))); title = "Mission revanche"; }
  else { const m = MISSIONS.find(x => x.id === id); queue = fromGroups(m.gen(), 6); title = m.title; }
  queue.forEach(q => { delete q._retry; delete q._hint; q.key = q.key || keyOf(q); });
  S = { id, title, queue, i: 0, errors: 0, gain: 0, combo: 0, res: [], dots: [] };
  ST.sessions++; save();
  showQ();
}
function keyOf(q) { return [q.type, q.prompt, q.ctx || "", q.answer, q.word || "", q.noun || ""].join("#"); }
function playbar() {
  const total = S.queue.length;

  return `<div class="playbar"><button class="icon-btn" id="p-quit" aria-label="Quitter la mission">${IC.close}</button><div class="dots">${dots}</div>${S.combo >= 2 ? `<span class="combo" id="combo">Série ×${S.combo}</span>` : ""}</div>`;
}
function head(q) {

  const sj = m ? m.subj : (q.obj && q.obj[0] === "N" ? "adj" : "pos");
  return `<div class="qhead"><span class="tag">${S.title}${q._retry ? " · deuxième chance" : ""}</span><span class="subj ${sj}">${SUBJ[sj]}</span></div>`;
}

function lock() { $("play").querySelectorAll("button:not(#p-quit):not(#q-say)").forEach(b => b.disabled = true); KB = null; }
function answerMcq(q, i) {

/* Construction (phrase ou groupe nominal) */
function setupBuild(q) {
  const stack = []; const out = $("bo"), okb = $("b-ok");
  const draw = () => { const s = smartJoin(stack.map(i => q.tiles[i])); out.textContent = s || "Touche les étiquettes dans l'ordre"; out.classList.toggle("empty", !s); okb.disabled = !s; };
  $("play").querySelectorAll(".tile").forEach(b => b.onclick = () => { stack.push(+b.dataset.i); b.disabled = true; sndKey(); draw(); });
  $("b-del").onclick = () => { const i = stack.pop(); if (i !== undefined) $("play").querySelector(`.tile[data-i="${i}"]`).disabled = false; draw(); };
  okb.onclick = () => {
    const s = smartJoin(stack.map(i => q.tiles[i])); lock();
    const ok = q.cmp === "nocomma" ? normNC(s) === normNC(q.word) : norm(s) === norm(q.word);
    feedback(q, ok, esc(q.correct), s);
  };
}

/* Grossis le nom : 2 ou 3 adjectifs, dans l'ordre */
function setupNp(q) {
  const pick = []; const out = $("npout"), okb = $("b-ok");
  const draw = () => {
    const w = pick.map(i => `<b>${q.chips[i]}</b>`);
    while (w.length < 2) w.push(`<span class="gap">……</span>`);
    out.innerHTML = w.join(", ");
    okb.disabled = pick.length < 2;
    $("play").querySelectorAll(".tile").forEach(b => { b.disabled = pick.includes(+b.dataset.i) || pick.length >= 3; });
  };
  $("play").querySelectorAll(".tile").forEach(b => b.onclick = () => { if (pick.length >= 3) return; pick.push(+b.dataset.i); sndKey(); draw(); });
  $("b-del").onclick = () => { pick.pop(); draw(); };
  okb.onclick = () => {
    const ch = pick.map(i => q.chips[i]); lock();
    const ok = ch.every((a, k) => k === 0 || fam(ch[k - 1]) < fam(a));
    const sorted = ch.slice().sort((a, b) => fam(a) - fam(b));
    const good = `${q.det} ${sorted.join(", ")} ${q.noun}`;
    q.correct = good; q.sayAns = good;
    q.explain = `${npWhy(sorted)}. ${ok ? "Belle phrase, et dans le bon ordre !" : "On range toujours les familles dans cet ordre."}`;
    feedback(q, ok, `<b>${esc(good)}</b>`, `${q.det} ${ch.join(", ")} ${q.noun}`);
  };
  draw();
}

/* Clavier : AZERTY, touche majuscule et grosse touche apostrophe */
function kbHtml() {
  const k = (c, cls = "") => `<button class="key ${cls}" data-k="${c}">${c}</button>`;
  return `<div class="kb" id="kb" lang="en">
    <div class="r">${[..."azertyuiop"].map(c => k(c)).join("")}</div>
    <div class="r">${[..."qsdfghjklm"].map(c => k(c)).join("")}</div>
    <div class="r"><button class="key shift" data-k="SHIFT" id="kb-shift" aria-label="Majuscule">${IC.shift}</button>${[..."wxcvbn"].map(c => k(c)).join("")}<button class="key apo" data-k="'" aria-label="Apostrophe">'</button><button class="key w2" data-k="DEL" aria-label="Effacer">${IC.del}</button></div>
    <div class="r"><button class="key w5" data-k=" ">espace</button><button class="key w5 go" data-k="OK" id="kb-ok">Valider</button></div></div>`;
}
function setupType(q) {
  let val = "", shift = false;
  const out = $("typed"), sh = $("kb-shift");
  const draw = () => { out.textContent = val; sh.classList.toggle("on", shift); $("kb").querySelectorAll(".key[data-k]").forEach(b => { const c = b.dataset.k; if (c.length === 1 && /[a-z]/.test(c)) b.textContent = shift ? c.toUpperCase() : c; }); };
  const press = (c, fromKb) => {
    if (!KB) return;
    if (c === "OK") {
      if (!val.trim()) return; const v = val; lock();
      const ok = [q.answer, ...(q.alt || [])].some(a => norm(a) === norm(v));
      let note = "";
      if (ok && /^[A-Z]/.test(q.answer) && !/^[A-Z]/.test(v.trim())) note = `N'oublie pas la majuscule au prénom : <b>${esc(q.answer)}</b>.`;
      feedback(q, ok, fixHtml(v, q.answer), v, note); return;
    }
    if (c === "SHIFT") { shift = !shift; draw(); return; }
    if (c === "DEL") val = val.slice(0, -1);
    else if (val.length < 30) { val += fromKb && shift ? c.toUpperCase() : c; if (fromKb) shift = false; }
    sndKey(); draw();
  };
  KB = press;
  $("kb").querySelectorAll(".key").forEach(b => b.addEventListener("click", () => press(b.dataset.k, true)));
  draw();
}
document.addEventListener("keydown", e => {
  if (!KB || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Enter") { e.preventDefault(); KB("OK"); }
  else if (e.key === "Backspace") { e.preventDefault(); KB("DEL"); }
  else if (e.key.length === 1 && /[a-z' ’‘]/i.test(e.key)) { e.preventDefault(); KB(/[’‘]/.test(e.key) ? "'" : e.key, false); }
});

/* Mise en évidence des lettres à corriger */
function fixHtml(ans, correct) {
  const a = norm(ans), b = correct; const bn = b.toLowerCase();
  const n = a.length, m = bn.length; const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === bn[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const keep = new Array(m).fill(false); let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === bn[j]) { keep[j] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  return [...b].map((c, k) => keep[k] ? esc(c) : `<mark>${esc(c)}</mark>`).join("");
}

/* Réponse */
function feedback(q, ok, correctHtml, yours, note) {
  const first = !q._retry;
  if (first) { S.res.push({ obj: q.obj, ok }); const m = ST.mastery[q.obj] || []; m.push(ok ? 1 : 0); ST.mastery[q.obj] = m.slice(-14); }
  let gain = 0, extra = "";
  if (ok) {
    gain = q._retry ? 4 : q._hint ? 6 : 10; S.combo++;
    if (S.combo % 3 === 0) { gain += 5; extra = `Série de ${S.combo} sans faute : +5 miles bonus !`; }
    if (S.id === "revanche") ST.missed = ST.missed.filter(x => x.key !== q.key);
    sndOk();
  } else {
    S.combo = 0; if (first) S.errors++;
    if (first && S.id !== "boss") S.queue.push(Object.assign(JSON.parse(JSON.stringify(q)), { _retry: true }));
    const clean = JSON.parse(JSON.stringify(q)); delete clean._retry; delete clean._hint;
    if (q.type === "np") { delete clean.correct; delete clean.explain; delete clean.sayAns; }
    if (!ST.missed.some(x => x.key === q.key)) ST.missed.push(clean);
    ST.missed = ST.missed.slice(-30);
    sndKo();
  }
  if (q.type === "type" && $("typed")) { const g = $("typed").parentElement; g.classList.remove("cur"); g.style.color = ok ? "#1A6B45" : "#B42A1A"; g.querySelector(".caret")?.remove(); }
  S.dots[S.i] = ok ? "ok" : "ko";
  S.gain += gain; ST.xp += gain; save();
  const PRAISE = ["Well done!", "Brilliant!", "Great job!", "Perfect!", "Spot on!", "Fantastic!", "Bravo !", "Top class!"];
  const showFix = q.type === "type" || q.type === "build" || q.type === "np";
  const sh = $("sheet");
  sh.className = "sheet" + (ok ? "" : " ko");
  sh.innerHTML = `<div class="in">
    <div class="row"><h3>${ok ? one(PRAISE) : "Almost… Presque !"}</h3><span class="spacer"></span>${gain ? `<span class="gain">+${gain} miles</span>` : ""}</div>
    ${ok ? (showFix ? `<p class="fix" lang="en">${esc(q.correct || q.answer)}</p>` : "") : showFix
      ? `<p>Ta réponse : <span class="yours" lang="en">${esc(yours || "")}</span></p><p>La bonne réponse : <span class="fix" lang="en">${correctHtml}</span></p>`
      : `<p><b>La bonne réponse :</b> <span lang="en">${correctHtml}</span></p>`}
    ${q.explain ? `<p>${q.explain}</p>` : ""}${note ? `<p>${note}</p>` : ""}${extra ? `<p class="gain" style="font-size:17px">${extra}</p>` : ""}
    ${!ok && S.id !== "boss" && first ? `<p class="muted" style="font-size:15px">Pas grave : cette question reviendra à la fin pour une deuxième chance.</p>` : ""}
    <div class="row"><button class="icon-btn" id="s-say" aria-label="Écouter l'explication">${IC.speak}</button><button class="btn" id="s-next" style="flex:1">Continuer</button></div></div>`;
  sh.hidden = false;
  $("s-say").onclick = () => speak([EN(q.sayAns || q.correct || q.answer), FR(q.explain || "")]);
  $("s-next").onclick = next; $("s-next").focus({ preventScroll: true });
}
function next() { $("sheet").hidden = true; S.i++; if (S.i < S.queue.length) showQ(); else finish(); }
document.addEventListener("keydown", e => { if (e.key === "Enter" && !$("sheet").hidden && !KB) { e.preventDefault(); $("s-next")?.click(); } });

/* ---------- Fin de mission ---------- */
function finish() {
  const firstRes = S.res, score = firstRes.filter(r => r.ok).length, total = firstRes.length;
  let stars;
  if (S.id === "boss") stars = score >= BOSS_TOTAL - 1 ? 3 : score >= BOSS_TOTAL - 4 ? 2 : 1; else stars = S.errors === 0 ? 3 : S.errors <= 2 ? 2 : 1;
  let newCards = [];
  if (MISSIONS.some(m => m.id === S.id)) {
    const before = MISSIONS.filter(m => ST.stars[m.id]).length;
    ST.stars[S.id] = Math.max(ST.stars[S.id] || 0, stars);
    const after = MISSIONS.filter(m => ST.stars[m.id]).length;
    if (after > before) ST.lastPax = after;
    newCards = CARDS.filter(c => c.m === S.id && !ST.cards.includes(c.k));
  }
  if (S.id === "boss") {
    ST.boss.push({ date: isoToday(), score });
    if (score >= BOSS_TOTAL - 1 && !ST.cards.includes("trophy")) newCards = CARDS.filter(c => c.k === "trophy");
  }
  newCards.forEach(c => ST.cards.push(c.k));
  save(); sndWin();
  let detail = "";
  if (S.id === "boss") {
    const by = {}; firstRes.forEach(r => { by[r.obj] = by[r.obj] || [0, 0]; by[r.obj][1]++; if (r.ok) by[r.obj][0]++; });
    const LAB = { P1: "Un seul propriétaire ('s)", P2: "Pluriels en -s (')", P3: "Pluriels irréguliers ('s)", P4: "Phrases It is / They are", N1: "Ordre des adjectifs" };
    detail = `<div class="result-card"><h3 style="font-size:20px">Détail de ton test</h3><div class="objlist">${Object.keys(LAB).map(k => { const v = by[k] || [0, 0]; return `<div class="objrow"><span>${LAB[k]}</span><span class="pill ${v[0] === v[1] ? "a" : v[0] >= v[1] / 2 ? "b" : "c"}">${v[0]} / ${v[1]}</span></div>`; }).join("")}</div></div>`;
  }
  const msg = S.id === "boss" ? (score >= BOSS_TOTAL - 1 ? "Prêt pour le contrôle !" : score >= BOSS_TOTAL - 4 ? "Presque prêt !" : "On continue l'entraînement !") : stars === 3 ? "Mission parfaite !" : stars === 2 ? "Très belle mission !" : "Mission accomplie !";
  $("result").innerHTML = `<div class="center">
    <div class="tag" style="margin-top:12px">${S.title}</div><h1 style="font-size:36px;margin-top:6px">${msg}</h1>
    <div class="bigstars">${[1, 2, 3].map(i => IC.star(i <= stars).replace("<svg", `<svg class="pop" style="animation-delay:${i * .15}s"`)).join("")}</div>
    <p style="font-size:19px;margin:0">${score} bonne${score > 1 ? "s" : ""} réponse${score > 1 ? "s" : ""} sur ${total} du premier coup · <span class="gain">+${S.gain} miles</span></p>
    ${newCards.length ? `<div class="result-card"><h3 style="font-size:20px">Nouvelle carte postale de Londres</h3><div class="unlocked">${newCards.map(c => `<div style="display:grid;gap:6px;justify-items:center"><div class="plate md">${art(c.k)}</div><b>${c.t}</b></div>`).join("")}</div></div>` : ""}
    ${detail}
    <div style="display:grid;gap:10px;margin-top:16px"><button class="btn red" id="r-pause">Pause cerveau (30 secondes)</button><button class="btn ghost" id="r-home">Retour à la ligne du bus</button></div></div>`;
  $("r-pause").onclick = renderPause; $("r-home").onclick = renderHome;
  show("result");
}

/* ---------- Pause cerveau ---------- */
let pauseTimer = null;
function renderPause() {
  const [t, d] = one(PAUSES); let left = 30;
  $("pause").innerHTML = `<div class="center"><div class="tag" style="margin-top:12px">Pause cerveau</div><div class="plate big" style="margin-top:10px">${art("bus")}</div><h1 style="font-size:32px;margin-top:10px">${t}</h1>
    <p style="font-size:20px;max-width:30ch;margin:10px auto">${d}</p>
    <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="pr" cx="60" cy="60" r="50" fill="none" stroke="var(--red)" stroke-width="10" stroke-linecap="round" stroke-dasharray="314.2" stroke-dashoffset="0" transform="rotate(-90 60 60)"/><text id="pt" x="60" y="72" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="36" fill="var(--ink)">30</text></svg>
    <div style="display:grid;gap:10px"><button class="btn" id="pa-ok" disabled>J'ai fini !</button><button class="btn ghost" id="pa-say">${icon(IC.speak)} Écouter</button></div></div>`;
  $("pa-say").onclick = () => speak(d);
  $("pa-ok").onclick = () => { clearInterval(pauseTimer); renderHome(); };
  clearInterval(pauseTimer);
  pauseTimer = setInterval(() => {
    left--; const pr = $("pr"), pt = $("pt"); if (!pr) { clearInterval(pauseTimer); return; }
    pr.setAttribute("stroke-dashoffset", (314.2 * (30 - left) / 30).toFixed(1)); pt.textContent = Math.max(left, 0);
    if (left <= 20) $("pa-ok").disabled = false;
    if (left <= 0) { clearInterval(pauseTimer); tone([[784, .15], [1047, .3]]); }
  }, 1000);
  show("pause"); if (ST.voice) speak(t + ". " + d);
}

/* ---------- Album ---------- */
function renderAlbum() {
  const n = CARDS.filter(c => ST.cards.includes(c.k)).length;
  $("album").innerHTML = `<div class="top"><button class="icon-btn" id="al-back" aria-label="Retour">${IC.back}</button><h1 style="font-size:28px">Mes cartes postales de Londres</h1></div>
    <p class="muted" style="margin:0 0 14px">${n} carte${n > 1 ? "s" : ""} sur ${CARDS.length}. Chaque arrêt réussi en ajoute une. Le trophée d'or se gagne au Test de Wembley.</p>
    <div class="album">${CARDS.map(c => { const on = ST.cards.includes(c.k); const mi = MISSIONS.findIndex(m => m.id === c.m); return `<button class="acard ${on ? "" : "locked"}" data-k="${c.k}" ${on ? "" : "disabled"}><div class="plate">${art(c.k)}</div><h3>${on ? c.t : "Carte mystère"}</h3><div class="when">${mi >= 0 ? "Arrêt " + (mi + 1) : "Test de Wembley"}</div></button>`; }).join("")}</div>`;
  $("al-back").onclick = renderHome;
  $("album").querySelectorAll(".acard:not(.locked)").forEach(b => b.onclick = () => openCard(CARDS.find(c => c.k === b.dataset.k)));
  show("album");
}
function openCard(c) {
  const m = $("modal");
  m.innerHTML = `<div class="modal" id="mbg"><div class="box" role="dialog" aria-label="${c.t}"><div class="plate big">${art(c.k)}</div><h2 style="font-size:26px">${c.t}</h2><p style="margin:0;font-size:18px">${c.txt}</p>
    <div class="row"><button class="icon-btn" id="m-say" aria-label="Écouter">${IC.speak}</button><button class="btn" id="m-close" style="flex:1">Fermer</button></div></div></div>`;
  m.hidden = false;
  $("m-say").onclick = () => speak(c.t + ". " + c.txt);
  $("m-close").onclick = () => { m.hidden = true; try { speechSynthesis.cancel(); } catch (e) {} };
  $("mbg").onclick = e => { if (e.target.id === "mbg") m.hidden = true; };
}

/* ---------- Espace parent ---------- */
const PLAN = [["Séance 1", ["m1", "m2"]], ["Séance 2", ["m3", "m4"]], ["Séance 3", ["m5", "m6"]], ["Séance 4", ["m7", "m8"]], ["Séance 5", ["m9", "boss"]]];
const planLabel = id => id === "boss" ? "Test de Wembley" : `${MISSIONS.findIndex(m => m.id === id) + 1}. ${MISSIONS.find(m => m.id === id).title}`;
const isDone = id => id === "boss" ? ST.boss.length > 0 : !!ST.stars[id];
function planDates() {
  if (!ST.evalDate || !ST.planStart) return null;
  const days = Math.max(1, daysTo(ST.evalDate) + Math.max(0, -daysTo(ST.planStart)));
  const perDay = Math.max(1, Math.ceil(PLAN.length / days));
  return PLAN.map((_, k) => addDays(ST.planStart, Math.floor(k / perDay)));
}
function renderParent() {
  const today = isoToday();
  const objRows = Object.keys(OBJ).map(k => {
    const m = ST.mastery[k] || []; const pct = m.length ? Math.round(m.reduce((a, b) => a + b, 0) / m.length * 100) : 0;
    const pill = m.length < 3 ? ["n", "Pas assez joué"] : pct >= 80 ? ["a", "Acquis"] : pct >= 55 ? ["b", "En progrès"] : ["c", "À retravailler"];
    return `<div class="obj"><div class="top2"><span>${OBJ[k]}</span><span class="pill ${pill[0]}">${pill[1]}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="muted" style="font-size:13px">${m.length ? `${pct} % de réussite du premier coup sur les ${m.length} dernières questions` : "Aucune question jouée"}</div></div>`;
  }).join("");
  const boss = ST.boss.length ? ST.boss.slice(-5).map(b => `${fmtDay(b.date)} : ${b.score}/${BOSS_TOTAL}`).join(" · ") : "Pas encore joué";
  const dates = planDates();
  $("parent").innerHTML = `<div class="top"><button class="icon-btn" id="pp-back" aria-label="Retour">${IC.back}</button><h1 style="font-size:28px">Espace parent</h1></div>
    <div class="panel"><h3>Où en est Carlo</h3>${objRows}
      <p class="muted" style="font-size:13px;margin:10px 0 0">Test de Wembley : ${boss}. ${ST.sessions} séance${ST.sessions > 1 ? "s" : ""} lancée${ST.sessions > 1 ? "s" : ""} · ${ST.missed.length} question${ST.missed.length > 1 ? "s" : ""} en attente de revanche.</p></div>
    <div class="panel"><h3>Date du contrôle d'anglais</h3>
      <label class="toggle" for="t-date"><span>Le contrôle a lieu le</span><input type="date" id="t-date" value="${ST.evalDate}"></label>
      <p class="muted" style="font-size:13px;margin:6px 0 0">La fiche ne donne pas de date. Une fois la date saisie, l'accueil affiche le compte à rebours et le plan ci-dessous se cale jour par jour.</p></div>
    <div class="panel"><h3>${dates ? "Plan jusqu'au contrôle" : "Plan de révision en 5 séances"}</h3><div class="plan">${PLAN.map(([s, ids], k) => `<div class="d ${dates && dates[k] === today ? "now" : ""}"><span class="dt">${dates ? fmtDay(dates[k]) + "<br>" : ""}<span class="muted" style="font-weight:400;font-size:13px">${s}</span></span><span>${ids.map(planLabel).join("<br>")}</span><span>${ids.every(isDone) ? icon(IC.star(true), 20) : ""}</span></div>`).join("")}</div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Deux missions par séance, puis la pause cerveau. Une séance par jour suffit ; deux au maximum. Si une séance saute, l'accueil propose toujours la bonne mission. La veille du contrôle : Test de Wembley puis mission revanche.</p></div>
    <div class="panel"><h3>Ce que travaille le module</h3>
      <p><b>Leçon 6, Apostrophes for possession :</b> les 12 phrases de la fiche (Anna, Ben… the elephants) sont reprises, avec une vingtaine d'autres. Le module ajoute deux pièges classiques qui ne sont pas sur la fiche : l'apostrophe ajoutée à tort sur un simple pluriel (« the dog's are barking ») et le choix It is / They are.</p>
      <p><b>Leçon 4, Expanded noun phrases :</b> les 5 groupes écrits par Carlo (my cute, little, brown dog…) sont repris, avec l'ordre des 8 familles d'adjectifs, la place des virgules et a / an devant un adjectif (an interesting, small book).</p>
      <p>Les consignes sont lues en français, les phrases en anglais par une voix anglaise (si l'appareil en a une installée).</p></div>
    <div class="panel"><h3>Points d'attention sur les fiches</h3>
      <p><b>Fiche 6, très bien réussie :</b> toutes les réponses sont justes, y compris les pluriels irréguliers (the men's cups, the children's keys). Deux détails de présentation : des majuscules sur des noms communs (the Boys', the Men's, Rabbits') — en anglais comme en français, pas de majuscule aux noms communs — et « They are Rabbits' tails » sans <i>the</i>, alors que la phrase de départ dit « the rabbits ».</p>
      <p><b>It is / They are :</b> Carlo choisit déjà bien selon l'objet (ball → It is, clothes → They are). C'est l'objet qui décide, pas le propriétaire : « It is the girls' ball » (un seul ballon pour plusieurs filles). Le module l'entraîne à l'arrêt 5.</p>
      <p><b>L'apostrophe à la main :</b> en écriture attachée, il faut bien lever le stylo et placer l'apostrophe clairement avant ou après le s. Sur la fiche, c'est lisible ; à surveiller en contrôle, car la place de l'apostrophe est toute la réponse.</p>
      <p><b>Fiche 4, les virgules :</b> la leçon dit de séparer les adjectifs par des virgules, et le module suit la leçon (c'est ce que la maîtresse attendra). En anglais courant, on met souvent la virgule seulement entre deux adjectifs d'opinion (a lovely, friendly dog) et pas devant une couleur ou une matière (a big red ball). Si Carlo écrit « a big red ball » sans virgule, ce n'est pas une faute d'anglais ; en classe, suivre la consigne de la fiche.</p>
      <p><b>« our nice, little, English teacher » :</b> la phrase de Carlo est juste. Elle a même deux sens : une maîtresse anglaise, ou une maîtresse d'anglais. C'est une bonne occasion d'en rire avec lui.</p></div>
    <div class="panel"><h3>Conseils pour un enfant qui a du mal à rester concentré</h3>
      <p><b>Court et cadré :</b> deux missions (8 minutes), la pause cerveau, puis on arrête. Toujours au même moment de la journée. Finir sur une réussite.</p>
      <p><b>Faire dire la règle :</b> après une bonne réponse, demandez « comment tu as su ? ». Les trois phrases à ancrer : « un seul → 's », « plusieurs avec s → ' », « children, men, women → 's ».</p>
      <p><b>L'ordre des adjectifs en chanson :</b> la pause « chanson des adjectifs » fait réciter les 8 familles en tapant dans les mains. Refaites-la au dîner ou en voiture.</p>
      <p><b>Repasser sur papier :</b> le contrôle se fait au stylo. Un soir sur deux, dictez-lui 3 phrases « belongs to » à transformer par écrit (The bikes belong to the twins → They are the twins' bikes).</p>
      <p><b>Valoriser l'effort :</b> une erreur revient en fin de mission, c'est prévu. Félicitez le fait d'avoir réessayé plus que le score.</p></div>
    <div class="panel"><h3>Réglages</h3>
      <label class="toggle" for="t-sound"><span>Sons de réussite</span><input type="checkbox" id="t-sound" ${ST.sound ? "checked" : ""}></label>
      <label class="toggle" for="t-voice"><span>Lire chaque question à voix haute</span><input type="checkbox" id="t-voice" ${ST.voice ? "checked" : ""}></label>
      <button class="btn ghost" id="t-reset" style="margin-top:8px;width:100%;min-height:48px;font-size:17px">Remettre la progression à zéro</button><div id="t-confirm"></div></div>`;
  $("pp-back").onclick = renderHome;
  $("t-date").onchange = e => { ST.evalDate = e.target.value || ""; ST.planStart = ST.evalDate ? today : ""; save(); renderParent(); };
  $("t-sound").onchange = e => { ST.sound = e.target.checked; save(); };
  $("t-voice").onchange = e => { ST.voice = e.target.checked; save(); };
  $("t-reset").onclick = () => {
    $("t-confirm").innerHTML = `<div class="confirm"><span>Toute la progression, les étoiles et les cartes postales seront effacées sur cet appareil.</span><div class="row"><button class="btn ghost" id="c-no" style="flex:1;min-height:46px;font-size:17px">Annuler</button><button class="btn red" id="c-yes" style="flex:1;min-height:46px;font-size:17px">Effacer</button></div></div>`;
    $("c-no").onclick = () => $("t-confirm").innerHTML = "";
    $("c-yes").onclick = () => { ST = fresh(); save(); renderParent(); };
  };
  show("parent");
}

renderHome();
</script>
