<style>
/* Mise en page : une colonne type application mobile, la frise chronologique verticale sert de carte des missions. */
:root{
  --bg:#EDF1F8; --surface:#FFFFFF; --surface-2:#E2E8F4; --ink:#17203B; --muted:#55607E; --line:#CBD4E6;
  --machine:#3345C8; --on-machine:#FFFFFF; --brass:#B97C0C; --brass-soft:#F5E3BA;
  --good:#1F8556; --good-soft:#DCF2E5; --bad:#C2432E; --bad-soft:#FADFD8;
  --plate:#FBF6EA; --plate-line:#E5D9BC; --on-period:#1B1B1B;
  --p0:#9A7457; --p1:#EDB91F; --p2:#38A468; --p3:#E1543E; --p4:#3B78DA;
  --f-display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Andika","Trebuchet MS",system-ui,sans-serif;
  --f-roman:"Cinzel","Times New Roman",serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1530; --surface:#19213F; --surface-2:#232D54; --ink:#EEF1FF; --muted:#A6B0D2; --line:#2F3A66;
    --machine:#8391FF; --on-machine:#0F1530; --brass:#F1B43C; --brass-soft:#3A3120;
    --good:#4DCB8C; --good-soft:#153A2B; --bad:#FF7D66; --bad-soft:#43221C;
    --plate:#F4EEDF; --plate-line:#CDBF9E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1530; --surface:#19213F; --surface-2:#232D54; --ink:#EEF1FF; --muted:#A6B0D2; --line:#2F3A66;
  --machine:#8391FF; --on-machine:#0F1530; --brass:#F1B43C; --brass-soft:#3A3120;
  --good:#4DCB8C; --good-soft:#153A2B; --bad:#FF7D66; --bad-soft:#43221C;
  --plate:#F4EEDF; --plate-line:#CDBF9E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  -webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--machine);outline-offset:2px}
sup{font-size:.62em;line-height:0}
.roman{font-family:var(--f-roman);letter-spacing:.04em}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}

/* ---------- Boutons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 20px;border-radius:16px;border:0;
  font-family:var(--f-display);font-size:20px;background:var(--machine);color:var(--on-machine);box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.brass{background:var(--brass);color:#1B1406}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.icon-btn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px}

/* ---------- Accueil ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hello{margin:6px 0 2px}
.hello .who{font-family:var(--f-display);font-size:34px;line-height:1.05}
.hello .who span{color:var(--brass)}
.countdown{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.countdown .big{font-family:var(--f-display);font-size:34px;color:var(--machine);font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.machine-wrap{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin:8px 0 16px}
.machine-wrap svg{width:150px;height:150px}
.gear-on{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.today{background:var(--machine);color:var(--on-machine);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;border:0;width:100%;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.today .lab{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:700}
.today h3{font-size:22px}
.plate{background:var(--plate);border:2px solid var(--plate-line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.plate svg{width:100%;height:100%;display:block}
.plate img.ph{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.plate:has(img.ph){padding:0;background:var(--surface-2)}
.credits{font-size:13px;color:var(--muted);display:grid;gap:4px}
.credits a{color:inherit}
.plate.sm{width:64px;height:64px;padding:4px}
.plate.md{width:76px;height:76px;padding:5px}
.plate.big{width:min(220px,62vw);aspect-ratio:1;padding:10px;margin:0 auto;max-width:100%}

.section-title{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px}
.section-title h2{font-size:24px}
.map{position:relative;display:grid;gap:12px;padding-left:34px}
.map::before{content:"";position:absolute;left:12px;top:6px;bottom:22px;width:10px;border-radius:6px;
  background:linear-gradient(var(--p0),var(--p1),var(--p2),var(--p3),var(--p4))}
.map::after{content:"";position:absolute;left:5px;bottom:4px;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid var(--p4)}
.mission{position:relative;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 12px}
.mission::before{content:"";position:absolute;left:-30px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--surface);border:4px solid var(--ink)}
.mission.done::before{background:var(--brass);border-color:var(--brass)}
.mission h3{font-size:19px;line-height:1.15}
.mission .sub{font-size:14px;color:var(--muted)}
.mission .num{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mission.next{border-color:var(--machine);box-shadow:0 0 0 3px color-mix(in srgb,var(--machine) 25%,transparent)}
.stars{display:flex;gap:2px}
.stars svg{width:20px;height:20px}
.extra{display:grid;gap:12px;margin-top:22px}
.card-btn{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px}
.card-btn h3{font-size:20px}
.card-btn .sub{font-size:14px;color:var(--muted)}
.card-btn.boss{background:var(--brass-soft);border-color:var(--brass)}
.ico{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--surface-2)}
.ico svg{width:38px;height:38px}

/* ---------- Jeu ---------- */
.playbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.dot{height:10px;flex:1;min-width:10px;border-radius:6px;background:var(--line)}
.dot.ok{background:var(--good)} .dot.ko{background:var(--bad)} .dot.cur{background:var(--machine)}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.prompt{font-family:var(--f-display);font-size:26px;line-height:1.2;margin:4px 0 14px;text-wrap:balance}
.prompt b{color:var(--machine);font-weight:400}
.prompt .roman{font-size:1.1em}
.qart{margin:4px 0 16px}
.choices{display:grid;gap:10px}
.choice{min-height:58px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.choice:active{transform:scale(.99)}
.choice.ok{background:var(--good-soft);border-color:var(--good)}
.choice.ko{background:var(--bad-soft);border-color:var(--bad)}
.choice:disabled{cursor:default}
.choices.img{grid-template-columns:1fr 1fr}
.choices.img .choice{flex-direction:column;padding:8px;text-align:center;font-size:15px}
.choices.img .plate{width:100%;aspect-ratio:1;padding:6px}
.choices.img .lbl{min-height:20px}
.choices.img .lbl.hide{visibility:hidden}
.hint-row{display:flex;gap:10px;margin-top:16px}
.hint{margin-top:12px;background:var(--brass-soft);border:2px dashed var(--brass);border-radius:14px;padding:12px 14px;font-size:17px}
.hint svg{max-width:100%;height:auto;display:block;margin-top:8px}

/* Ordre */
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px;border-radius:16px;border:2px dashed var(--line);background:var(--surface-2);margin-bottom:12px}
.slot-num{font-size:12px;color:var(--muted);font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:10px 14px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:6px}
.tile.placed{background:var(--machine);color:var(--on-machine);border-color:var(--machine)}
.tile.used{opacity:.25}
.tile.ok{background:var(--good);border-color:var(--good);color:#fff}
.tile.ko{background:var(--bad);border-color:var(--bad);color:#fff}
.tile .d{font-weight:400;opacity:.85;font-size:14px}

/* Chiffres romains */
.rdisplay{min-height:84px;display:flex;align-items:center;justify-content:center;font-family:var(--f-roman);font-size:52px;letter-spacing:.06em;
  background:var(--plate);color:#2B2F45;border:2px solid var(--plate-line);border-radius:16px;margin-bottom:12px}
.rdisplay.empty{font-family:var(--f-body);font-size:16px;color:#7A6E55}
.rtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px;margin-bottom:12px}
.rtile{min-height:70px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-roman);font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rtile small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:4px}
.rnum{font-family:var(--f-display);font-size:64px;text-align:center;color:var(--machine);line-height:1;margin:4px 0 12px}

/* Frise */
.frise{display:flex;height:74px;margin:8px 0 4px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.seg{flex:var(--w);border:0;border-right:2px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:700;font-size:13px;line-height:1.1;padding:4px;color:var(--on-period);min-width:0}
.seg:last-child{border-right:0;clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%);padding-right:14px}
.seg.p0{background:var(--p0);color:#fff}.seg.p1{background:var(--p1)}.seg.p2{background:var(--p2)}.seg.p3{background:var(--p3);color:#fff}.seg.p4{background:var(--p4);color:#fff}
.seg.ok{outline:4px solid var(--good);outline-offset:-4px}.seg.ko{outline:4px solid var(--bad);outline-offset:-4px}
.frise-dates{position:relative;height:20px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.frise-dates span{position:absolute;transform:translateX(-50%)}
.pchip{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:14px;color:var(--on-period)}
.pchip.p0{background:var(--p0);color:#fff}.pchip.p1{background:var(--p1)}.pchip.p2{background:var(--p2)}.pchip.p3{background:var(--p3);color:#fff}.pchip.p4{background:var(--p4);color:#fff}

/* Feuille de réponse */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:4px solid var(--good);border-radius:22px 22px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 30px rgba(0,0,0,.18);animation:up .22s ease-out}
.sheet.ko{border-top-color:var(--bad)}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:10px}
.sheet h3{font-size:26px;color:var(--good)}
.sheet.ko h3{color:var(--bad)}
.sheet p{margin:0;font-size:17px}
.gain{font-family:var(--f-display);color:var(--brass);font-size:20px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.pad-bottom{height:240px}

/* Résultats, pause, album */
.center{text-align:center}
.bigstars{display:flex;justify-content:center;gap:8px;margin:12px 0}
.bigstars svg{width:62px;height:62px}
.bigstars svg.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.result-card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0;display:grid;gap:10px}
.unlocked{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.unlocked .plate{animation:pop .5s .2s cubic-bezier(.3,1.6,.5,1) both}
.objlist{display:grid;gap:8px;text-align:left}
.objrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:15px}
.ring{width:170px;height:170px;margin:10px auto;display:block}
.album{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px;text-align:left;display:grid;gap:6px;min-width:0}
.acard .plate{width:100%;aspect-ratio:1;padding:8px}
.acard.locked .plate svg,.acard.locked .plate img{filter:grayscale(1) brightness(.2);opacity:.25}
.acard h3{font-size:16px;line-height:1.15}
.acard .when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border-radius:22px;padding:18px;max-width:520px;width:100%;display:grid;gap:12px;max-height:90vh;overflow:auto;animation:up .22s ease-out}

/* Parents */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.panel h3{font-size:20px;margin-bottom:8px}
.obj{display:grid;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.obj:last-child{border-bottom:0}
.obj .top2{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:15px}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.a{background:var(--good-soft);color:var(--good)} .pill.b{background:var(--brass-soft);color:var(--brass)} .pill.c{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--surface-2);color:var(--muted)}
.plan{display:grid;gap:6px}
.plan .d{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:15px}
.plan .d.now{outline:3px solid var(--machine)}
.plan .d .dt{font-weight:700;font-variant-numeric:tabular-nums}
.tips p{margin:0 0 10px;font-size:15px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:16px}
.toggle input{width:26px;height:26px;accent-color:var(--machine)}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:grid;gap:10px;margin-top:8px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* =========================================================
   Gardien du Temps — révision « Mesurer le temps » CE2
   ========================================================= */
const INK = "#2B2F45";
const f1 = n => Math.round(n * 10) / 10;
const svg = (inner, vb = "0 0 120 120") => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;

function gearPath(cx, cy, r, n) {
  let d = ""; const ri = r * 0.8, s = Math.PI / n;
  for (let i = 0; i < n; i++) {
    const a = i * 2 * s;
    [[ri, a - s * 0.55], [r, a - s * 0.32], [r, a + s * 0.32], [ri, a + s * 0.55]].forEach(([rr, aa], j) => {
      d += (i === 0 && j === 0 ? "M" : "L") + f1(cx + rr * Math.cos(aa)) + " " + f1(cy + rr * Math.sin(aa));
    });
  }
  return d + "Z";
}
function clockFace(cx, cy, r, hh, mm, rim = "#fff") {
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${rim}" stroke="${INK}" stroke-width="${f1(r * 0.12)}"/>`;
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6, r1 = r * (i % 3 ? 0.8 : 0.7), r2 = r * 0.88;
    s += `<line x1="${f1(cx + r1 * Math.sin(a))}" y1="${f1(cy - r1 * Math.cos(a))}" x2="${f1(cx + r2 * Math.sin(a))}" y2="${f1(cy - r2 * Math.cos(a))}" stroke="${INK}" stroke-width="${f1(i % 3 ? r * 0.04 : r * 0.07)}" stroke-linecap="round"/>`;
  }
  const ha = ((hh % 12) + mm / 60) * Math.PI / 6, ma = mm * Math.PI / 30;
  s += `<line x1="${cx}" y1="${cy}" x2="${f1(cx + r * 0.48 * Math.sin(ha))}" y2="${f1(cy - r * 0.48 * Math.cos(ha))}" stroke="${INK}" stroke-width="${f1(r * 0.1)}" stroke-linecap="round"/>`;
  s += `<line x1="${cx}" y1="${cy}" x2="${f1(cx + r * 0.72 * Math.sin(ma))}" y2="${f1(cy - r * 0.72 * Math.cos(ma))}" stroke="${INK}" stroke-width="${f1(r * 0.06)}" stroke-linecap="round"/>`;
  return s + `<circle cx="${cx}" cy="${cy}" r="${f1(r * 0.08)}" fill="#D9483B"/>`;

}

let S = null;

function lock() { $("play").querySelectorAll("button.choice,button.tile,button.rtile,button.seg,#r-del,#r-ok,#p-hint").forEach(b => b.disabled = true); }

  }
  if (S.id === "boss") {
    ST.boss.push({ date: new Date().toISOString().slice(0, 10), score });

  }

    const by = {}; firstRes.forEach(r => { by[r.obj] = by[r.obj] || [0, 0]; by[r.obj][1]++; if (r.ok) by[r.obj][0]++; });
    detail = `<div class="result-card"><h3 style="font-size:20px">Les 7 objectifs</h3><div class="objlist">${Object.keys(OBJ).map(k => { const v = by[k] || [0, 0]; return `<div class="objrow"><span>${OBJ[k]}</span><span class="pill ${v[0] === v[1] ? "a" : v[0] ? "b" : "c"}">${v[0]}/${v[1]}</span></div>`; }).join("")}</div></div>`;
  }
  const msg = S.id === "boss" ? (score >= 12 ? "Prêt pour le jour J !" : score >= 9 ? "Presque prêt !" : "On continue l'entraînement !") : stars === 3 ? "Mission parfaite !" : stars === 2 ? "Très belle mission !" : "Mission accomplie !";
  $("result").innerHTML = `<div class="center">
    <div class="tag" style="margin-top:12px">${S.title}</div><h1 style="font-size:36px;margin-top:6px">${msg}</h1>
    <div class="bigstars">${[1, 2, 3].map(i => IC.star(i <= stars).replace("<svg", `<svg class="pop" style="animation-delay:${i * .15}s"`)).join("")}</div>
    <p style="font-size:19px;margin:0">${S.id === "boss" ? `<b>${score}/14</b> bonnes réponses du premier coup` : `${score} bonne${score > 1 ? "s" : ""} réponse${score > 1 ? "s" : ""} sur ${total} du premier coup`} · <span class="gain">+${S.gain} éclats</span></p>
    ${newCards.length ? `<div class="result-card"><h3 style="font-size:20px">Nouvelle${newCards.length > 1 ? "s" : ""} carte${newCards.length > 1 ? "s" : ""} pour ton musée</h3><div class="unlocked">${newCards.map(c => `<div style="display:grid;gap:4px;justify-items:center;width:92px"><div class="plate" style="width:84px;height:84px;padding:6px">${art(c.k)}</div><span style="font-size:13px;font-weight:700">${c.t}</span></div>`).join("")}</div></div>` : ""}
    ${detail}
    <div style="display:grid;gap:10px;margin-top:16px"><button class="btn brass" id="r-pause">Pause cerveau (30 secondes)</button><button class="btn ghost" id="r-home">Retour à la frise</button></div></div>`;
  $("r-pause").onclick = renderPause; $("r-home").onclick = renderHome;
  show("result");
}

/* ---------- Pause cerveau ---------- */
let pauseTimer = null;
function renderPause() {
  const [t, d] = one(PAUSES); let left = 30;
  $("pause").innerHTML = `<div class="center"><div class="tag" style="margin-top:12px">Pause cerveau</div><h1 style="font-size:34px;margin-top:6px">${t}</h1>
    <p style="font-size:20px;max-width:30ch;margin:10px auto">${d}</p>
    <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="pr" cx="60" cy="60" r="50" fill="none" stroke="var(--brass)" stroke-width="10" stroke-linecap="round" stroke-dasharray="314.2" stroke-dashoffset="0" transform="rotate(-90 60 60)"/><text id="pt" x="60" y="70" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="34" fill="var(--ink)">30</text></svg>
    <div style="display:grid;gap:10px"><button class="btn" id="pa-ok" disabled>J'ai fini !</button><button class="btn ghost" id="pa-say">${IC.speak.replace("<svg", "<svg width=\"22\" height=\"22\"")} Écouter</button></div></div>`;
  $("pa-say").onclick = () => say(d);
  $("pa-ok").onclick = () => { clearInterval(pauseTimer); renderHome(); };
  clearInterval(pauseTimer);
  pauseTimer = setInterval(() => {
    left--; const pr = $("pr"), pt = $("pt"); if (!pr) { clearInterval(pauseTimer); return; }
    pr.setAttribute("stroke-dashoffset", f1(314.2 * (30 - left) / 30)); pt.textContent = Math.max(left, 0);
    if (left <= 20) $("pa-ok").disabled = false;
    if (left <= 0) { clearInterval(pauseTimer); tone([[784, .15], [1047, .3]]); }
  }, 1000);
  show("pause"); if (ST.voice) say(d);
}

/* ---------- Musée ---------- */
function renderAlbum() {
  const n = CARDS.filter(c => ST.cards.includes(c.k)).length;
  $("album").innerHTML = `<div class="top"><button class="icon-btn" id="al-back" aria-label="Retour">${IC.back}</button><h1 style="font-size:28px">Mon musée du temps</h1></div>
    <p class="muted" style="margin:0 0 14px">${n} carte${n > 1 ? "s" : ""} sur ${CARDS.length}. Chaque mission réussie ajoute des cartes.</p>
    <div class="album">${CARDS.map(c => { const on = ST.cards.includes(c.k); return `<button class="acard ${on ? "" : "locked"}" data-k="${c.k}" ${on ? "" : "disabled"}><div class="plate">${art(c.k)}</div><h3>${on ? c.t : "Carte mystère"}</h3><div class="when">${on ? (c.p !== undefined ? `<span class="pchip ${PERIODES[c.p].c}">${c.d}</span>` : c.d) : "à gagner"}</div></button>`; }).join("")}</div>`;
  $("al-back").onclick = renderHome;
  $("album").querySelectorAll(".acard:not(.locked)").forEach(b => b.onclick = () => openCard(CARDS.find(c => c.k === b.dataset.k)));
  show("album");
}
function openCard(c) {
  const m = $("modal");
  m.innerHTML = `<div class="modal" id="mbg"><div class="box" role="dialog" aria-label="${c.t}"><div class="plate big">${art(c.k)}</div><h2 style="font-size:26px">${c.t}</h2>
    <div>${c.p !== undefined ? `<span class="pchip ${PERIODES[c.p].c}">${PERIODES[c.p].n} · ${c.d}</span>` : `<span class="muted">${c.d}</span>`}</div><p style="margin:0;font-size:18px">${c.txt}</p>
    <div class="row"><button class="icon-btn" id="m-say" aria-label="Écouter">${IC.speak}</button><button class="btn" id="m-close" style="flex:1">Fermer</button></div></div></div>`;
  m.hidden = false;
  $("m-say").onclick = () => say(c.t + ". " + c.txt);
  $("m-close").onclick = () => { m.hidden = true; try { speechSynthesis.cancel(); } catch (e) {} };
  $("mbg").onclick = e => { if (e.target.id === "mbg") m.hidden = true; };
}

/* ---------- Espace parent ---------- */
const PLAN = [
  ["2026-10-22", "m1"], ["2026-10-23", "m2"], ["2026-10-24", "m3"], ["2026-10-25", "repos"], ["2026-10-26", "m4"], ["2026-10-27", "m5"], ["2026-10-28", "m6"],
  ["2026-10-29", "m7"], ["2026-10-30", "m8"], ["2026-10-31", "repos"], ["2026-11-01", "repos"], ["2026-11-02", "revanche"], ["2026-11-03", "boss"], ["2026-11-04", "léger"]
];
function planLabel(id) {
  if (id === "repos") return "Repos";
  if (id === "revanche") return "Mission revanche";
  if (id === "boss") return "Évaluation blanche";
  if (id === "léger") return "Revanche + relire les fiches";
  const i = MISSIONS.findIndex(m => m.id === id); return `Mission ${i + 1} · ${MISSIONS[i].title}`;
}
function fmtDay(iso) { const d = new Date(iso + "T12:00:00"); return `${JOURS_JS[d.getDay()].slice(0, 3)}. ${d.getDate()} ${MOIS_COURT[d.getMonth()]}`; }
function renderParent() {
  const todayIso = (() => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; })();
  const objRows = Object.keys(OBJ).map(k => {
    const m = ST.mastery[k] || []; const pct = m.length ? Math.round(m.reduce((a, b) => a + b, 0) / m.length * 100) : 0;
    const pill = m.length < 3 ? ["n", "Pas assez joué"] : pct >= 80 ? ["a", "Acquis"] : pct >= 55 ? ["b", "En progrès"] : ["c", "À retravailler"];
    return `<div class="obj"><div class="top2"><span>${OBJ[k]}</span><span class="pill ${pill[0]}">${pill[1]}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="muted" style="font-size:13px">${m.length ? `${pct} % de réussite sur les ${m.length} dernières questions` : "Aucune question jouée"}</div></div>`;
  }).join("");
  const done = id => (ST.stars[id] ? true : id === "boss" ? ST.boss.length > 0 : false);
  $("parent").innerHTML = `<div class="top"><button class="icon-btn" id="pp-back" aria-label="Retour">${IC.back}</button><h1 style="font-size:28px">Espace parent</h1></div>
    <div class="panel"><h3>Où en est Carlo</h3>${objRows}
      <p class="muted" style="font-size:13px;margin:10px 0 0">${ST.sessions} séance${ST.sessions > 1 ? "s" : ""} lancée${ST.sessions > 1 ? "s" : ""} · ${ST.missed.length} question${ST.missed.length > 1 ? "s" : ""} en attente de revanche${ST.boss.length ? ` · évaluations blanches : ${ST.boss.map(b => b.score + "/14").join(", ")}` : ""}</p></div>
    <div class="panel"><h3>Plan de révision jusqu'au 5 novembre</h3><div class="plan">${PLAN.map(([d, id]) => `<div class="d ${d === todayIso ? "now" : ""}"><span class="dt">${fmtDay(d)}</span><span>${planLabel(id)}</span><span>${done(id) ? IC.star(true).replace("<svg", "<svg width=\"18\" height=\"18\"") : ""}</span></div>`).join("")}</div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Si une journée saute, reprenez simplement à la mission suivante : l'écran d'accueil propose toujours la bonne.</p></div>
    <div class="panel tips"><h3>Conseils pour un enfant qui a du mal à rester concentré</h3>
      <p><b>Court et régulier :</b> une mission par jour (5 minutes), toujours au même moment, plutôt qu'une longue séance. Arrêtez-vous sur une réussite.</p>
      <p><b>Le corps d'abord :</b> la pause cerveau après chaque mission n'est pas facultative. Bouger relance l'attention.</p>
      <p><b>Faire dire la méthode :</b> après une bonne réponse sur les siècles ou les chiffres romains, demandez « comment tu as trouvé ? ». Verbaliser ancre la procédure.</p>
      <p><b>Valoriser l'effort :</b> félicitez la persévérance (« tu as réessayé et tu as trouvé ») plus que le score. Une erreur revient en fin de mission : c'est prévu, pas un échec.</p>
      <p><b>Retour au papier :</b> la veille de l'évaluation, refaites avec lui l'exercice « Mets ces dates en siècles » et la frise de la pochette bleue, au crayon. L'évaluation se fait sur papier.</p>
      <p><b>À noter :</b> sur la fiche « Frise chronologique », la date imprimée 1 472 est une coquille. Le début des Temps modernes est bien 1492, comme Carlo l'a écrit.</p></div>
    <div class="panel"><h3>Crédits photos</h3><div class="credits">${CREDITS.map(([n, a, l, u]) => `<div><a href="${u}" target="_blank" rel="noopener">${n}</a> · ${a} · ${l}</div>`).join("")}<div>Photos issues de Wikimedia Commons.</div></div></div>
    <div class="panel"><h3>Réglages</h3>
      <label class="toggle" for="t-sound"><span>Sons de réussite</span><input type="checkbox" id="t-sound" ${ST.sound ? "checked" : ""}></label>
      <label class="toggle" for="t-voice"><span>Lire chaque question à voix haute automatiquement</span><input type="checkbox" id="t-voice" ${ST.voice ? "checked" : ""}></label>
      <button class="btn ghost" id="t-reset" style="margin-top:8px;width:100%;min-height:48px;font-size:17px">Remettre la progression à zéro</button><div id="t-confirm"></div></div>`;
  $("pp-back").onclick = renderHome;
  $("t-sound").onchange = e => { ST.sound = e.target.checked; save(); };
  $("t-voice").onchange = e => { ST.voice = e.target.checked; save(); };
  $("t-reset").onclick = () => {
    $("t-confirm").innerHTML = `<div class="confirm"><span>Toute la progression, les étoiles et les cartes seront effacées sur ce téléphone.</span><div class="row"><button class="btn ghost" id="c-no" style="flex:1;min-height:46px;font-size:16px">Annuler</button><button class="btn" id="c-yes" style="flex:1;min-height:46px;font-size:16px;background:var(--bad);color:#fff">Effacer</button></div></div>`;
    $("c-no").onclick = () => $("t-confirm").innerHTML = "";
    $("c-yes").onclick = () => { ST = fresh(); save(); renderParent(); };
  };
  show("parent");
}

renderHome();
</script>
</body>
</html>
